[workspace]
resolver = "3"
members = [
  "apps/desktop",
  "crates/design/icons",
  "crates/design/theme",
  "crates/design/tasks",
  "crates/design/components",
  "crates/design/text",
  "crates/design/editor",
  "crates/design/backgrounds",
  "crates/views/logos",
  "crates/views/chat",
  "crates/views/actions",
  "crates/features/desktop_browser",
  "crates/features/desktop_emulator",
  "crates/features/desktop_settings",
  "crates/features/desktop_search",
  "crates/features/desktop_onboarding",
  "crates/features/desktop_quilts",
  "crates/features/desktop_dialogs",
  "crates/features/desktop_agents",
  "crates/features/desktop_canvas",
  "crates/features/desktop_orchestrator",
  "crates/features/desktop_source_control",
  "crates/features/desktop_usage",
  "crates/features/mobile",
  "crates/features/desktop_dock",
  "crates/features/desktop_sidebar",
  "crates/features/desktop_chat",
  "apps/remote",
  "apps/android",
  "crates/patchwork_android_platform",
  "crates/patchwork_model",
  "crates/patchwork_harness",
  "crates/patchwork_platform",
  "crates/patchwork_lifecycle",
  "crates/patchwork_themes",
  "crates/patchwork_vault",
  "crates/patchwork_git",
  "crates/provider_core",
  "crates/provider_acp",
  "crates/provider_api",
  "crates/provider_claude",
  "crates/provider_codex",
  "crates/provider_antigravity",
  "crates/provider_opencode",
  "crates/patchwork_sidecars",
  "crates/patchwork_core",
  "crates/patchwork_server",
  "crates/patchwork_gateway",
  "crates/patchwork_protocol",
  "crates/patchwork_client",
]
# A bare `cargo run` or `cargo build` is for the app.
default-members = ["apps/desktop"]

# The app's version, which Settings → Updates compares with the latest release.
[workspace.package]
version = "26.11.162"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/PolarisPyra/Patchwork"
readme = "README.md"
keywords = ["agents", "desktop", "gpui"]
categories = ["development-tools"]

# Every crate the workspace uses, so all members resolve to the same version. Features are turned
# on by the member that needs them.
[workspace.dependencies]
patchwork-core = { path = "crates/patchwork_core" }
patchwork-server = { path = "crates/patchwork_server" }
patchwork-gateway = { path = "crates/patchwork_gateway" }
patchwork-harness = { path = "crates/patchwork_harness" }
patchwork-model = { path = "crates/patchwork_model" }
patchwork-lifecycle = { path = "crates/patchwork_lifecycle" }
patchwork-desktop-emulator = { path = "crates/features/desktop_emulator" }
patchwork-desktop-browser = { path = "crates/features/desktop_browser" }
patchwork-desktop-dialogs = { path = "crates/features/desktop_dialogs" }
patchwork-desktop-agents = { path = "crates/features/desktop_agents" }
patchwork-desktop-canvas = { path = "crates/features/desktop_canvas" }
patchwork-desktop-orchestrator = { path = "crates/features/desktop_orchestrator" }
patchwork-desktop-source-control = { path = "crates/features/desktop_source_control" }
patchwork-desktop-usage = { path = "crates/features/desktop_usage" }
patchwork-desktop-dock = { path = "crates/features/desktop_dock" }
patchwork-desktop-sidebar = { path = "crates/features/desktop_sidebar" }
patchwork-desktop-chat = { path = "crates/features/desktop_chat" }
patchwork-desktop-onboarding = { path = "crates/features/desktop_onboarding" }
patchwork-desktop-quilts = { path = "crates/features/desktop_quilts" }
patchwork-desktop-search = { path = "crates/features/desktop_search" }
patchwork-desktop-settings = { path = "crates/features/desktop_settings" }
patchwork-provider-acp = { path = "crates/provider_acp" }
patchwork-provider-antigravity = { path = "crates/provider_antigravity" }
patchwork-provider-api = { path = "crates/provider_api" }
patchwork-provider-claude = { path = "crates/provider_claude" }
patchwork-provider-codex = { path = "crates/provider_codex" }
patchwork-provider-core = { path = "crates/provider_core" }
patchwork-provider-opencode = { path = "crates/provider_opencode" }
patchwork-git = { path = "crates/patchwork_git" }
patchwork-platform = { path = "crates/patchwork_platform" }
patchwork-sidecars = { path = "crates/patchwork_sidecars" }
patchwork-client = { path = "crates/patchwork_client" }
patchwork-mobile = { path = "crates/features/mobile" }
patchwork-protocol = { path = "crates/patchwork_protocol" }
patchwork-themes = { path = "crates/patchwork_themes" }
patchwork-design-icons = { path = "crates/design/icons" }
patchwork-design-theme = { path = "crates/design/theme" }
patchwork-design-tasks = { path = "crates/design/tasks" }
patchwork-design-components = { path = "crates/design/components" }
patchwork-design-text = { path = "crates/design/text" }
patchwork-design-editor = { path = "crates/design/editor" }
patchwork-design-backgrounds = { path = "crates/design/backgrounds" }
patchwork-views-logos = { path = "crates/views/logos" }
patchwork-views-chat = { path = "crates/views/chat" }
patchwork-views-actions = { path = "crates/views/actions" }
patchwork-vault = { path = "crates/patchwork_vault" }
patchwork-android-platform = { path = "crates/patchwork_android_platform" }

anyhow = { version = "1", default-features = false }
async-io = { version = "2", default-features = false }
argon2 = { version = "0.6", default-features = false }
base64 = { version = "0.22", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
chrono = { version = "0.4", default-features = false }
dirs = { version = "6", default-features = false }
embed-resource = { version = "3", default-features = false }
enigo = { version = "0.6", default-features = false }
futures = { version = "0.3", default-features = false }
globset = { version = "0.4", default-features = false }
http = { version = "1", default-features = false }
# GPUI through Longbridge's gpui-kit: GPUI itself (`gpui-pre`) plus its base and component layers.
# `use gpui::...` resolves to gpui-kit, which re-exports GPUI.
gpui = { package = "gpui-kit", version = "0.11", default-features = false }
# Only for GPUI features gpui-kit does not forward (hot reload). Must match gpui-kit's exact pin.
gpui-hot-reload = { package = "gpui-pre", version = "=0.3.14", default-features = false }
ignore = { version = "0.4", default-features = false }
image = { version = "0.25", default-features = false }
keyring = { version = "3", default-features = false }
libc = { version = "0.2", default-features = false }
log = { version = "0.4", default-features = false, features = ["kv"] }
mimalloc = { version = "0.1", default-features = false }
miniz_oxide = { version = "0.8", default-features = false }
minisign-verify = { version = "0.3", default-features = false }
# The Secret Service client GPUI builds on Linux, at the same release so it is built once.
oo7 = { version = "0.6", default-features = false }
notify = { version = "8", default-features = false }
portable-pty = { version = "0.9", default-features = false }
prost = { version = "0.14", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
qrcodegen = { version = "1.8", default-features = false }
regex = { version = "1", default-features = false }
resvg = { version = "0.46", default-features = false }
rusqlite = { version = "0.41", default-features = false }
rust-embed = { version = "8", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
sha2 = { version = "0.10", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"] }
thiserror = { version = "2", default-features = false }
tokio = { version = "1", default-features = false }
toml = { version = "1.1", default-features = false }
trash = { version = "5.4", default-features = false }
tonic = { version = "0.14", default-features = false }
tonic-prost = { version = "0.14", default-features = false }
tungstenite = { version = "0.30", default-features = false }
two-face = { version = "0.5", default-features = false }
unicode-segmentation = { version = "1", default-features = false }
ureq = { version = "3", default-features = false }
url = { version = "2", default-features = false }
uuid = { version = "1", default-features = false }
vt100 = { version = "0.16", default-features = false }
which = { version = "7", default-features = false }
windows-sys = { version = "0.60", default-features = false }
winreg = { version = "0.56", default-features = false }
x11rb = { version = "0.13", default-features = false }
xcap = { version = "0.9", default-features = false }
zbus = { version = "5", default-features = false }
zeroize = { version = "1", default-features = false }
zip = { version = "9", default-features = false }
zune-jpeg = { version = "0.5", default-features = false }

# Debug builds optimize the dependencies: unoptimized, GPUI takes about 50ms to lay out a frame,
# so resizing and scrolling stutter. The workspace crates stay unoptimized: at opt-level 3 an edit
# to the core took about 10s to rebuild instead of 4.5s.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Full debug info made up nearly all of target/ (595 MB of the 598 MB app binary). Line tables
# keep file:line in panics and backtraces.
[profile.dev]
debug = "line-tables-only"

# The app that ships: thin LTO optimizes across crates while keeping codegen parallel.
[profile.release]
lto = "thin"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
# Only a binary's `main` ends the process; anywhere else it would skip saving and cleanup.
exit = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
literal_string_with_formatting_args = "allow"
# GPUI, zbus and the platform crates pull in several versions of the same crates, which the
# workspace can't unify.
multiple_crate_versions = "allow"
# Pixel, scroll and column math converts between `f32`, `usize` and the integer sizes all over the
# UI; the values are bounded by what fits on a screen.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Its fix replaces `assert!(x.is_empty())` with a comparison against a typed empty array, which
# reads worse and says no more when it fails.
assert_is_empty = "allow"
# Only the app calls these with maps, always built with the standard hasher.
implicit_hasher = "allow"
# Views are one element tree per function and the turn parsers one match over every event;
# splitting either only moves the lines apart.
too_many_lines = "allow"
