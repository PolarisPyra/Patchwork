[package]
name = "patchwork-rpc-server"
description = "Embedded HTTP and WebSocket RPC server, pairing, and scope enforcement for Patchwork"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
patchwork-rpc-protocol.workspace = true
patchwork-platform.workspace = true
base64 = { workspace = true, default-features = true }
chacha20poly1305 = { workspace = true, default-features = true }
log = { workspace = true, default-features = true }
qrcodegen.workspace = true
serde = { workspace = true, default-features = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true, features = ["preserve_order"] }
sha2 = { workspace = true, default-features = true }
tungstenite = { workspace = true, features = ["handshake"] }
url = { workspace = true, default-features = true }

[lints]
workspace = true
