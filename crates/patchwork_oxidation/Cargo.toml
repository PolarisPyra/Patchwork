[package]
name = "patchwork-oxidation"
description = "Reusable Rust hot-reload library and CLI runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["hot-reload", "dev-tools", "watcher"]
categories.workspace = true

[lib]
name = "patchwork_oxidation"
path = "src/lib.rs"

[[bin]]
name = "patchwork-oxidation"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true, default-features = true }
chrono = { workspace = true, features = ["clock"] }
globset = { workspace = true, default-features = true }
notify = { workspace = true, default-features = true }
patchwork-oxidation-client.workspace = true
serde = { workspace = true, default-features = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
toml = { workspace = true, default-features = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, default-features = true }

[lints]
workspace = true
