[package]
name = "patchwork-android"
description = "Patchwork's Android tools: the SDK, emulators, devices, and running an app on them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
patchwork-system.workspace = true
futures = { workspace = true, default-features = true }
http = { workspace = true, default-features = true }
image = { workspace = true, features = ["png", "jpeg", "webp"] }
libc = { workspace = true, default-features = true }
log = { workspace = true, default-features = true }
serde = { workspace = true, default-features = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
# The emulator's gRPC screen stream.
prost = { workspace = true, features = ["derive", "std"] }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tonic = { workspace = true, features = ["channel"] }
tonic-prost.workspace = true

[lints]
workspace = true
