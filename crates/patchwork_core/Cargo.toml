[package]
name = "patchwork-core"
description = "Patchwork's core: providers, persistence, usage, and thread import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
patchwork-model.workspace = true
patchwork-lifecycle.workspace = true
patchwork-platform.workspace = true
patchwork-sidecars.workspace = true
patchwork-harness.workspace = true
patchwork-themes.workspace = true
patchwork-provider-acp.workspace = true
patchwork-provider-antigravity.workspace = true
patchwork-provider-api = { workspace = true, default-features = false }
patchwork-provider-claude.workspace = true
patchwork-provider-codex.workspace = true
patchwork-provider-core.workspace = true
patchwork-provider-opencode = { workspace = true, features = ["sqlite"] }
patchwork-git.workspace = true
patchwork-vault = { workspace = true, default-features = false }
base64 = { workspace = true, default-features = true }
# File URIs for Antigravity attachments on every platform, and for Linux screenshots.
url = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true, features = ["preserve_order"] }
toml = { workspace = true, default-features = true }
serde = { workspace = true, default-features = true, features = ["derive", "rc"] }
log = { workspace = true, default-features = true }
uuid = { workspace = true, default-features = true, features = ["v4"] }
libc = { workspace = true, default-features = true }
# `alias` on a variant is for reading old saved names, and the bindings don't need it.
# No statement cache: nothing calls `prepare_cached`, and it is the only default feature used here.
rusqlite = { workspace = true, features = ["bundled", "fallible_uint"] }
ureq = { workspace = true, default-features = true, features = ["json"] }
# Wiping decrypted keys and scrubbed log values from memory after use.
zeroize = { workspace = true, default-features = true }
# The agent's file search tools.
ignore = { workspace = true, default-features = true }
# Watching the open project for changes.
notify = { workspace = true, default-features = true }
globset = { workspace = true, default-features = true }
regex = { workspace = true, default-features = true }
# Debug log folder names and line times in local time.
chrono = { workspace = true, features = ["clock"] }
# Exporting the debug logs as one file to send with a bug report.
# `deflate` would also build zopfli, a second compressor that only very high levels use.
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }
image = { workspace = true, features = ["png", "jpeg", "webp"] }
# Markdown quilts are drawn as HTML.
pulldown-cmark = { workspace = true, features = ["html"] }
# A chat background an agent drew as an SVG is kept as a picture.
resvg.workspace = true
# Chat background pictures are named after a hash of their bytes, so the same one is kept once.
sha2 = { workspace = true, default-features = true }

# The PATH installers write to the registry, which a running app's own PATH never picks up.
[target.'cfg(windows)'.dependencies]
winreg = { workspace = true, default-features = true }
# The job object a command runs in, which ends everything it started, and telling running
# programs that the user's PATH changed.
windows-sys = { workspace = true, default-features = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true, default-features = true }

[features]
default = ["keychain"]
# The system credential store. The helper Patchwork copies to SSH hosts is built without it: it
# never keeps a key.
keychain = ["patchwork-platform/keychain", "patchwork-vault/keychain", "patchwork-provider-api/keychain"]

[lints]
workspace = true
