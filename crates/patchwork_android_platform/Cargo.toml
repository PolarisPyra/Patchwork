[package]
name = "patchwork-android-platform"
description = "Patchwork's GPUI platform for Android: an android-activity NativeActivity rendered with wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
doctest = false
test = false

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
anyhow = { workspace = true, default-features = true }
futures = { workspace = true, default-features = true }
gpui = { package = "gpui-pre", version = "=0.3.14", default-features = false }
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.14" }
log = { workspace = true, default-features = true }
ndk = { version = "0.9", default-features = false, features = ["rwh_06"] }
raw-window-handle = { version = "0.6" }
uuid = { workspace = true }

[lints]
workspace = true
