[package]
name = "patchwork-rpc-client"
description = "Typed HTTP and WebSocket RPC client runtime for Patchwork servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
patchwork-rpc-protocol.workspace = true
serde = { workspace = true, default-features = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
thiserror = { workspace = true, default-features = true }
tungstenite = { workspace = true, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { workspace = true, default-features = true, features = ["json"] }
url = { workspace = true, default-features = true }

[dev-dependencies]
patchwork-rpc-server.workspace = true
patchwork-platform.workspace = true

[lints]
workspace = true
