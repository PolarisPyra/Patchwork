[package]
name = "patchwork-ui"
description = "What Patchwork's views share: the theme, the embedded assets, the controls, menus, dialogs and text tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
patchwork-core.workspace = true

base64 = { workspace = true, default-features = true }
chrono = { workspace = true, features = ["clock"] }
gpui = { workspace = true, default-features = true }
log = { workspace = true, default-features = true }
pulldown-cmark.workspace = true
rust-embed = { workspace = true, default-features = true, features = ["include-exclude"] }
serde_json = { workspace = true, default-features = true }
syntect.workspace = true
# Syntax definitions for syntect beyond its own set, such as TypeScript and TOML.
two-face = { workspace = true, features = ["syntect-onig"] }
unicode-segmentation = { workspace = true, default-features = true }

[lints]
workspace = true
