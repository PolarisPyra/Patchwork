name: Set up the build
description: >
  What every job that builds Patchwork needs: Tauri's Linux packages on Linux, or the tools that
  build the Windows installer there, the pinned Rust toolchain, pnpm, Node, and the JavaScript
  dependencies.
inputs:
  rust-toolchain:
    description: The Rust version to install, pinned in each workflow.
    required: true
  rust-components:
    description: Extra Rust components, such as rustfmt and clippy for the checks.
    default: ""
  windows:
    description: Set to "true" to build the Windows installer on Linux instead of the Linux app.
    default: "false"
  cache-packages:
    description: >
      Set to "true" to restore Tauri's Linux packages from the Actions cache instead of installing
      them, for the checks, which only compile and link against them.
    default: "false"
runs:
  using: composite
  steps:
    # The runner's Azure apt mirror is sometimes throttled (55 MB once took 20 minutes), so drop it
    # from the mirror list and use archive.ubuntu.com directly.
    - name: Use archive.ubuntu.com
      if: runner.os == 'Linux'
      shell: bash
      run: sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt

    # Installing them takes about a minute. The cache unpacks the packages' files without running
    # their setup scripts, which is enough to compile and link, so the release builds, whose
    # AppImage bundles some of these libraries, install them properly. The runner has
    # build-essential and file already.
    - name: Restore Tauri's Linux packages
      if: runner.os == 'Linux' && inputs.windows != 'true' && inputs.cache-packages == 'true'
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      with:
        packages: libayatana-appindicator3-dev libfuse2 librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf
        version: "1"

    - name: Install Tauri's Linux packages
      if: runner.os == 'Linux' && inputs.windows != 'true' && inputs.cache-packages != 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y -o Acquire::Retries=3 build-essential file libayatana-appindicator3-dev libfuse2 \
          librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf

    # cargo-xwin compiles and links with clang and lld against the Windows SDK it downloads, and
    # Tauri's installer script needs NSIS 3.09 or newer, which Ubuntu 24.04 has. The Tauri CLI on
    # Linux looks up the tray icon library with pkg-config for any target, and stops without it.
    - name: Install the tools that build for Windows
      if: inputs.windows == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y -o Acquire::Retries=3 clang lld llvm nsis libayatana-appindicator3-dev
    - name: Install cargo-xwin
      if: inputs.windows == 'true'
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: cargo-xwin@0.23.1

    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: ${{ inputs.rust-components }}
        targets: ${{ inputs.windows == 'true' && 'x86_64-pc-windows-msvc' || '' }}

    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22

    - name: Install JavaScript dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
