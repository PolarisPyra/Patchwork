name: Set up the build
description: >
  What every job that builds Patchwork needs: Tauri's Linux packages on Linux, the pinned Rust
  toolchain, pnpm, Node, and the JavaScript dependencies.
inputs:
  rust-toolchain:
    description: The Rust version to install, pinned in each workflow.
    required: true
  rust-components:
    description: Extra Rust components, such as rustfmt and clippy for the checks.
    default: ""
  directory:
    description: Where to install the JavaScript dependencies, for a job that builds outside the checkout.
    default: .
runs:
  using: composite
  steps:
    # The runner's Azure apt mirror is sometimes throttled (55 MB once took 20 minutes), so drop it
    # from the mirror list and use archive.ubuntu.com directly.
    - name: Install Tauri's Linux packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
        sudo apt-get update
        sudo apt-get install -y -o Acquire::Retries=3 build-essential file libayatana-appindicator3-dev libfuse2 \
          librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf

    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: ${{ inputs.rust-components }}

    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22

    - name: Install JavaScript dependencies
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: pnpm install --frozen-lockfile
