name: Bug
description: Something in Patchwork doesn't work.
labels:
  - bug
  - needs-triage
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Patchwork version
      placeholder: "26.11.65"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent
      description: The agent and model the chat was using, if it happened in a chat.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
