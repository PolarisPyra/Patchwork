name: Release

# Runs after each push to main that passes the CI workflow. While a commit since the last release
# has a Changelog: paragraph for users, it keeps one "Release vYY.M.N" pull request up to date: the
# next version and its notes, one commit on top of the commit the checks passed on. Merging that
# pull request with a merge commit releases it: the merge's own push starts a run that tags it,
# without waiting for the checks, then builds the Linux AppImage, the Windows installer (on Linux),
# and the macOS (Apple silicon) disk image and app bundle,
# publishes them to updates.patchworkeditor.com, and creates the GitHub release with the tag's
# notes, then points the website at the new release, deploys it, and announces it on Discord. A
# tag pushed by
# `scripts/release.sh` is built and published the same way. scripts/release.sh does the work, and
# docs/release.md explains it.
#
# A push that fails the checks changes nothing; the next push that passes brings the pull request
# up to date.
#
# Run it by hand (Actions → Release → Run workflow) to build every platform without publishing
# anything, to try a change to the build before releasing.
#
# A run on main also saves the dependency caches, which a tag's run can restore: a cold build costs
# about 50 of the private repo's counted minutes.
#
# Actions are pinned to commits, so a moved tag can't change what runs next to the secrets. The
# comment after each names the version it was.

on:
  # A tag, or the merge of the release pull request, which always changes the version in
  # package.json. The merge does not wait for the checks: the commit it releases is the release
  # pull request's, the commit the checks passed on with only the version and notes on top.
  push:
    tags:
      - "v*"
    branches: [main]
    paths: [package.json]
  # Each run of the CI workflow on main. Only a push that passed goes on; see the plan job.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the event too, so the run after the checks that updates the release pull request does
# not wait behind a release that is building.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned: a cache is only reused by the same compiler, and the CI workflow checks with this one.
  # Raising it rebuilds the caches on the next run by hand from main.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  # Whether a release pull request was just merged, and as which version. A CI run started by hand,
  # or one that failed or was cancelled for a newer push, changes nothing. A push to main goes on
  # only for the merge of the release pull request; `scripts/release.sh bump` releases by its tag.
  plan:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main'
      && startsWith(github.event.head_commit.message, 'Merge pull request')
      && contains(github.event.head_commit.message, format('from {0}/release', github.repository_owner)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Look for a merged release
        id: plan
        run: scripts/release.sh ci-plan

  # Tags the merged release. A tag pushed with the workflow's token starts no second run, so this
  # run builds it.
  cut:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Tag ${{ needs.plan.outputs.version }}
        id: cut
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        # An annotated tag records who made it.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/release.sh ci-tag "$VERSION"

  # Opens, updates, or closes the release pull request, only after the checks passed. After a merge
  # it runs once the tag is up, so commits pushed before the merge that the release left out get a
  # pull request of their own.
  pr:
    needs: [plan, cut]
    if: >-
      !cancelled() && github.event_name == 'workflow_run' && needs.plan.result == 'success'
      && needs.cut.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Update the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/release.sh ci-pr

  appimage:
    # Built on the oldest Ubuntu runner still available, so the AppImage links against an older
    # glibc and runs on newer distributions too.
    needs: cut
    # A tag, a release this run tagged, or a build by hand without publishing.
    if: >-
      !cancelled() && !failure() && (github.ref_type == 'tag'
      || github.event_name == 'workflow_dispatch' || needs.cut.outputs.tag != '')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      assets: ${{ steps.upload.outputs.assets }}
    env:
      # linuxdeploy is itself an AppImage; this lets it run without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
      # The tag being published, or nothing for a build by hand.
      RELEASE_TAG: ${{ needs.cut.outputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.cut.outputs.tag || github.ref }}

      - uses: ./.github/actions/setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: scripts/release.sh ci-build linux

      - name: Upload
        id: upload
        if: env.RELEASE_TAG != ''
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: scripts/release.sh ci-upload linux

  windows:
    # Cross-compiled on Linux with cargo-xwin, which builds it in half the time a Windows runner
    # takes and counts half the minutes. Ubuntu 24.04 has the NSIS that Tauri's installer needs.
    needs: cut
    if: >-
      !cancelled() && !failure() && (github.ref_type == 'tag'
      || github.event_name == 'workflow_dispatch' || needs.cut.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      assets: ${{ steps.upload.outputs.assets }}
    env:
      RELEASE_TAG: ${{ needs.cut.outputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
      # cargo-xwin fetches the Windows SDK and C runtime for arm64 as well unless told otherwise.
      XWIN_ARCH: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.cut.outputs.tag || github.ref }}

      - uses: ./.github/actions/setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          windows: "true"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The SDK and C runtime cargo-xwin unpacks. Fetching them from Microsoft took 15 minutes on a
      # runner; it skips that while its folder is there. Saved only on main, like the Rust cache.
      - name: Restore the Windows SDK
        id: xwin
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-0.23.1-${{ env.XWIN_ARCH }}

      - name: Build
        run: scripts/release.sh ci-build windows

      - name: Save the Windows SDK
        if: github.ref == 'refs/heads/main' && steps.xwin.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin
          key: ${{ steps.xwin.outputs.cache-primary-key }}

      - name: Upload
        id: upload
        if: env.RELEASE_TAG != ''
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: scripts/release.sh ci-upload windows

  macos:
    # macos-15 runs on Apple silicon, so the build is native arm64. Its minutes count ten times
    # against the private repo's allowance, so its timeout is the tightest, and it builds only for a
    # release or a run by hand: its build is quick without a cache.
    needs: cut
    if: >-
      !cancelled() && !failure() && (github.ref_type == 'tag'
      || github.event_name == 'workflow_dispatch' || needs.cut.outputs.tag != '')
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      assets: ${{ steps.upload.outputs.assets }}
    env:
      RELEASE_TAG: ${{ needs.cut.outputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.cut.outputs.tag || github.ref }}

      - uses: ./.github/actions/setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Build
        run: scripts/release.sh ci-build macos

      - name: Upload
        id: upload
        if: env.RELEASE_TAG != ''
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: scripts/release.sh ci-upload macos

  # The only job with the signing key or write access. It runs none of the project's dependencies:
  # it fetches each published file back, checks it, signs it with the Tauri CLI the lockfile pins,
  # checks the signature against the key built into the app, and only then publishes latest.json.
  release:
    needs: [cut, appimage, windows, macos]
    if: >-
      !cancelled() && !failure() && (github.ref_type == 'tag' || needs.cut.outputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.cut.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.cut.outputs.tag || github.ref }}

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 minisign

      - name: Check, sign, and publish latest.json and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          LINUX: ${{ needs.appimage.outputs.assets }}
          WINDOWS: ${{ needs.windows.outputs.assets }}
          MACOS: ${{ needs.macos.outputs.assets }}
        run: scripts/release.sh ci-release

  # Points the website's download links at the release just published, deploys the site to
  # Cloudflare Pages, and commits the new links to main with "Changelog: none", so the site never
  # needs a refresh by hand. It runs once latest.json is up, which site/refresh-downloads.mjs reads.
  # The deploy needs the CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages: Edit) and
  # CLOUDFLARE_ACCOUNT_ID secrets; without them it only commits. It holds no signing secrets.
  site:
    needs: [cut, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.cut.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Point the downloads at ${{ env.RELEASE_TAG }}
        run: node site/refresh-downloads.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the website was not deployed."
            exit 0
          fi
          npx --yes wrangler@4.156.2 pages deploy site --project-name patchwork-site \
            --branch main --commit-dirty=true

      - name: Commit the new links to main
        run: |
          git diff --quiet -- site/index.html && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Point the website's downloads at $RELEASE_TAG" -m "Changelog: none" \
            -- site/index.html
          # main can move while the release builds; the links commit goes on top of it.
          git pull -q --rebase origin main
          git push origin HEAD:main

  # Announces the published release in the Discord channel named by the DISCORD_RELEASE_WEBHOOK_URL
  # secret. A trailing /github is dropped, since that suffix makes Discord expect GitHub's payload,
  # so the release webhook's URL works too. Without the secret it only warns. It holds no signing
  # secrets.
  announce:
    needs: [cut, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ needs.cut.outputs.tag || github.ref_name }}
    steps:
      - name: Announce ${{ env.RELEASE_TAG }} on Discord
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_RELEASE_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK_URL is not set, so the release was not announced."
            exit 0
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          jq -n --arg text "New release: Patchwork $RELEASE_TAG is out. $url" '{content: $text}' \
            | curl -fsS -H 'Content-Type: application/json' --data-binary @- "${DISCORD_RELEASE_WEBHOOK_URL%/github}" >/dev/null
