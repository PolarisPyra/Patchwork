name: Release

# Releases Patchwork every hour, when main has a commit with a Changelog: paragraph for users since
# the last release: it checks main with the CI workflow, cuts the next YY.M.N version, tags it, then
# builds the Linux AppImage, the Windows installer, and the macOS (Apple silicon) disk image and app
# bundle, publishes them to updates.patchworkeditor.com, and creates the GitHub release with the
# tag's notes, then points the website at the new release and deploys it. A tag pushed by
# `scripts/release.sh` is built and published the same way.
# scripts/release.sh does the work, and docs/release.md explains it.
#
# Run it by hand (Actions → Release → Run workflow) with "Release now" ticked to cut that release
# without waiting for the hour's run. Unticked, it builds every platform without publishing
# anything, to try a change to the build before releasing.
#
# A run on main also saves the dependency caches, which a tag's run can restore: a cold build costs
# about 70 of the private repo's counted minutes. Pushes to main start no run.
#
# Actions are pinned to commits, so a moved tag can't change what runs next to the secrets. The
# comment after each names the version it was.

on:
  push:
    tags:
      - "v*"
  # At 17 minutes past each hour: GitHub delays or drops scheduled runs at the top of the hour.
  # A run that finds nothing for users ends after its first job, about a minute.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      release:
        description: Release now, if main has changes for users since the last release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned: a cache is only reused by the same compiler, and the CI workflow checks with this one.
  # Raising it rebuilds the caches on the next run by hand from main.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  # Whether this run releases, and as which version.
  plan:
    if: github.event_name == 'schedule' || inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Look for changes for users
        id: plan
        run: scripts/release.sh ci-plan

  check:
    needs: plan
    if: needs.plan.outputs.version != ''
    uses: ./.github/workflows/ci.yml

  # Commits the version and notes on top of the commit the checks passed on, tags it, and pushes
  # both. A tag pushed with the workflow's token starts no second run, so this run builds it.
  cut:
    needs: [plan, check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Tag ${{ needs.plan.outputs.version }}
        id: cut
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/release.sh ci-cut "$VERSION"

  appimage:
    # Built on the oldest Ubuntu runner still available, so the AppImage links against an older
    # glibc and runs on newer distributions too.
    needs: cut
    # A tag, the hour's release, or a build by hand without publishing.
    if: >-
      !cancelled() && !failure() && (github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && !inputs.release)
      || needs.cut.outputs.tag != '')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      assets: ${{ steps.upload.outputs.assets }}
    env:
      # linuxdeploy is itself an AppImage; this lets it run without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
      # The tag being published, or nothing for a build by hand.
      RELEASE_TAG: ${{ needs.cut.outputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.cut.outputs.tag || github.ref }}

      - uses: ./.github/actions/setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: scripts/release.sh ci-build linux

      - name: Upload
        id: upload
        if: env.RELEASE_TAG != ''
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: scripts/release.sh ci-upload linux

  windows:
    # A Dev Drive is needed for the Windows 2025 image's native ReFS support.
    needs: cut
    if: >-
      !cancelled() && !failure() && (github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && !inputs.release)
      || needs.cut.outputs.tag != '')
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      assets: ${{ steps.upload.outputs.assets }}
    env:
      RELEASE_TAG: ${{ needs.cut.outputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.cut.outputs.tag || github.ref }}

      # Cargo writes tens of thousands of files, and Defender scans each on C:. A trusted Dev
      # Drive skips that, so the checkout, the Rust toolchain, and cargo's files all live on one.
      - uses: samypr100/setup-dev-drive@cf663fdf88945e3faaa980ec525b5bc2350fbf9d # v3
        with:
          drive-size: 25GB
          workspace-copy: true
          trusted-dev-drive: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup

      - uses: ./.github/actions/setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          directory: ${{ env.DEV_DRIVE_WORKSPACE }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-windows
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE }} -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: scripts/release.sh ci-build windows

      - name: Upload
        id: upload
        if: env.RELEASE_TAG != ''
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: scripts/release.sh ci-upload windows

  macos:
    # macos-15 runs on Apple silicon, so the build is native arm64. Its minutes count ten times
    # against the private repo's allowance, so its timeout is the tightest, and it builds only for a
    # release or a run by hand: its build is quick without a cache.
    needs: cut
    if: >-
      !cancelled() && !failure() && (github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && !inputs.release)
      || needs.cut.outputs.tag != '')
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      assets: ${{ steps.upload.outputs.assets }}
    env:
      RELEASE_TAG: ${{ needs.cut.outputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.cut.outputs.tag || github.ref }}

      - uses: ./.github/actions/setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Build
        run: scripts/release.sh ci-build macos

      - name: Upload
        id: upload
        if: env.RELEASE_TAG != ''
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: scripts/release.sh ci-upload macos

  # The only job with the signing key or write access. It runs none of the project's dependencies:
  # it fetches each published file back, checks it, signs it with the Tauri CLI the lockfile pins,
  # checks the signature against the key built into the app, and only then publishes latest.json.
  release:
    needs: [cut, appimage, windows, macos]
    if: >-
      !cancelled() && !failure() && (github.ref_type == 'tag' || needs.cut.outputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.cut.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.cut.outputs.tag || github.ref }}

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 minisign

      - name: Check, sign, and publish latest.json and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          LINUX: ${{ needs.appimage.outputs.assets }}
          WINDOWS: ${{ needs.windows.outputs.assets }}
          MACOS: ${{ needs.macos.outputs.assets }}
        run: scripts/release.sh ci-release

  # Points the website's download links at the release just published, deploys the site to
  # Cloudflare Pages, and commits the new links to main with "Changelog: none", so the site never
  # needs a refresh by hand. It runs once latest.json is up, which site/refresh-downloads.mjs reads.
  # The deploy needs the CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages: Edit) and
  # CLOUDFLARE_ACCOUNT_ID secrets; without them it only commits. It holds no signing secrets.
  site:
    needs: [cut, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.cut.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Point the downloads at ${{ env.RELEASE_TAG }}
        run: node site/refresh-downloads.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the website was not deployed."
            exit 0
          fi
          npx --yes wrangler@4.156.2 pages deploy site --project-name patchwork-site \
            --branch main --commit-dirty=true

      - name: Commit the new links to main
        run: |
          git diff --quiet -- site/index.html && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Point the website's downloads at $RELEASE_TAG" -m "Changelog: none" \
            -- site/index.html
          # main can move while the release builds; the links commit goes on top of it.
          git pull -q --rebase origin main
          git push origin HEAD:main
