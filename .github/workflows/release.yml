name: Release

# Every push to main keeps one "Release vYY.M.N" pull request up to date, from the release branch:
# the next version in Cargo.toml and Cargo.lock, and its section of CHANGELOG.md, written from the
# Changelog: paragraphs of the commits since the last tag. Merging that pull request is the release:
# main then carries a version with no tag, so this run tags it, builds the Linux AppImage
# (scripts/build.sh), the Windows exe and the macOS (Apple silicon) disk image, and publishes them
# as the GitHub release with that section as its notes, beside the latest.json the app's update
# check reads, then points the website at it and announces it on Discord. docs/release.md
# explains it.
#
# Run it by hand (Actions → Release → Run workflow) to build all three without publishing.
#
# Actions are pinned to commits; the comment after each names the version it was.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  # Tags a version main carries that has no tag yet, which the jobs below then build and publish.
  # Otherwise brings the release pull request up to date, and nothing is built.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One at a time, so two pushes close together do not write the release branch over each other.
    concurrency: release-plan
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Tag the release, or update its pull request
        id: plan
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if ! git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            grep -q "^## \[$version\]" CHANGELOG.md \
              || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
            git tag "v$version"
            git push origin "v$version"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # CalVer: the next N this month, or 0 in a new month.
          month=$(date -u +%y.%-m)
          next="$month.0"
          [[ "$version" == "$month."* ]] && next="$month.$((${version##*.} + 1))"

          # Each commit's Changelog: paragraph, joined into one line, under the group it names.
          for commit in $(git rev-list --reverse "v$version..HEAD"); do
            entry=$(git show -s --format=%B "$commit" | awk '
              /^Changelog:/ { on = 1; sub(/^Changelog:[ \t]*/, "") }
              on && (/^[ \t]*$/ || /^[A-Za-z-]+-[Bb]y:/) { exit }
              on { printf "%s%s", (n++ ? " " : ""), $0 }')
            group=Changed
            for name in Added Changed Fixed Removed Security; do
              [[ "$entry" == "$name: "* ]] && group=$name && entry=${entry#"$name: "}
            done
            [[ -z "$entry" || "${entry,,}" =~ ^none\.?$ ]] && continue
            echo "- $entry" >> "$RUNNER_TEMP/$group"
          done
          {
            echo "## [$next] - $(date -u +%F)"
            for group in Added Changed Fixed Removed Security; do
              [ -f "$RUNNER_TEMP/$group" ] && printf '\n### %s\n\n' "$group" && cat "$RUNNER_TEMP/$group"
            done
            echo
          } > "$RUNNER_TEMP/section"
          grep -q '^- ' "$RUNNER_TEMP/section" \
            || { echo "Nothing for users since v$version, so there is no release to offer."; exit 0; }

          awk 'FNR == NR { section = section $0 "\n"; next }
            !done && /^## \[/ { printf "%s", section; done = 1 } { print }' \
            "$RUNNER_TEMP/section" CHANGELOG.md > "$RUNNER_TEMP/changelog"
          mv "$RUNNER_TEMP/changelog" CHANGELOG.md
          sed -i "/^\[workspace.package\]/,/^\[/s/^version = \".*\"/version = \"$next\"/" Cargo.toml
          sed -i -E "/^name = \"patchwork(-server)?\"$/{n;s/^version = \".*\"/version = \"$next\"/}" Cargo.lock

          # The release branch is this job's own: main with the release's one commit on top, made
          # again from each push, so it is written over rather than added to.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B release
          git commit -q -m "Release v$next" -m "Changelog: none" -- CHANGELOG.md Cargo.toml Cargo.lock
          git push -q --force origin release
          if [ -n "$(gh pr list --head release --state open --json number --jq '.[].number')" ]; then
            gh pr edit release --title "Release v$next" --body-file "$RUNNER_TEMP/section"
          else
            gh pr create --base main --head release --title "Release v$next" \
              --body-file "$RUNNER_TEMP/section"
          fi

  linux:
    needs: plan
    if: needs.plan.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    # The oldest Ubuntu runner, so the AppImage links against an older glibc and runs on newer
    # distributions too.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # appimagetool is itself an AppImage; this lets it run without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the Linux packages
        timeout-minutes: 10
        run: |
          apt_options=(-o Acquire::Retries=1 -o Acquire::ForceIPv4=true \
            -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            libdbus-1-dev libfontconfig-dev \
            libfreetype-dev libwayland-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # The helpers for Linux and Windows SSH hosts.
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # zig compiles the helpers' C (SQLite, ring) for both Linux architectures and Windows.
      - name: Install zig and cargo-zigbuild
        run: |
          pip install ziglang==0.15.2
          cargo install --locked cargo-zigbuild --version 0.23.4

      - name: Build the AppImage
        run: scripts/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: |
            target/release/Patchwork_amd64.AppImage
            target/release/Patchwork.AppDir/usr/bin/patchwork-remote-*
          if-no-files-found: error

  windows:
    needs: plan
    if: needs.plan.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build the exe
        shell: bash
        run: |
          cargo build --release -p patchwork
          cp target/release/patchwork.exe Patchwork_x64.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: Patchwork_x64.exe
          if-no-files-found: error

  macos:
    needs: plan
    if: needs.plan.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    # macos-15 runs on Apple silicon, so the build is native arm64.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # The helpers for macOS SSH hosts on both architectures.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Patchwork.app holds the binary, its icon made from the logo, and the Info.plist naming
      # them. It is signed ad hoc, not with a developer certificate.
      - name: Build the disk image
        run: |
          cargo build --release -p patchwork
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          app=dmg/Patchwork.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" icon.iconset
          cp target/release/patchwork "$app/Contents/MacOS/"
          for arch in aarch64 x86_64; do
            cargo build --release -p patchwork-remote --target $arch-apple-darwin
            cp target/$arch-apple-darwin/release/patchwork-remote \
              "$app/Contents/MacOS/patchwork-remote-macos-$arch"
          done
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/logo.png --out icon.iconset/icon_${size}x${size}.png
            [ $size = 512 ] || sips -z $((size * 2)) $((size * 2)) assets/logo.png \
              --out icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/patchwork.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Patchwork</string>
            <key>CFBundleDisplayName</key><string>Patchwork</string>
            <key>CFBundleIdentifier</key><string>dev.patchwork.ade</string>
            <key>CFBundleExecutable</key><string>patchwork</string>
            <key>CFBundleIconFile</key><string>patchwork</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname Patchwork -srcfolder dmg -format UDZO Patchwork_aarch64.dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            Patchwork_aarch64.dmg
            dmg/Patchwork.app/Contents/MacOS/patchwork-remote-*
          if-no-files-found: error

  publish:
    needs: [plan, linux, windows, macos]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 minisign

      # The signer is installed here, before the release key is in any step's environment, from
      # the lockfile in .github/signer: npm ci takes only the packages it records, each checked
      # against the hash recorded for it, and runs none of their install scripts.
      - name: Install the signer
        working-directory: .github/signer
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Each file is signed with the release key (the TAURI_SIGNING_PRIVATE_KEY secret and its
      # password), and its signature is checked against the key built into the app, as the app's
      # updater will check it, before anything is published. latest.json then names each file's
      # address, SHA-256 and signature, which the updater reads, and is signed the same way as
      # latest.json.minisig.
      #
      # The release stays a draft until every file is up, so it never becomes the latest with
      # latest.json naming a file that is not there yet.
      - name: Sign and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="${TAG#v}"
          signer="$GITHUB_WORKSPACE/.github/signer/node_modules/.bin/tauri"
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] \
            || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          key=$(sed -n 's/^const SIGNING_KEY: &str = "\(.*\)";$/\1/p' \
            crates/server/src/updates/release.rs)
          [ -n "$key" ] \
            || { echo "::error::Could not read SIGNING_KEY from crates/server/src/updates/release.rs"; exit 1; }
          awk -v head="## [$version]" \
            'index($0, head) == 1 { on = 1; print; next } on && /^## \[/ { exit } on' \
            CHANGELOG.md > notes.md
          cd release
          assets='[]'
          for name in Patchwork_amd64.AppImage Patchwork_x64.exe Patchwork_aarch64.dmg; do
            "$signer" signer sign --app-version "$version" "$name" > /dev/null
            base64 -d "$name.sig" > "$name.minisig"
            minisign -Vq -P "$key" -m "$name" -x "$name.minisig" \
              || { echo "::error::The signature of $name does not check out against the app's key"; exit 1; }
            assets=$(jq -c --arg name "$name" \
              --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$name" \
              --arg digest "sha256:$(sha256sum "$name" | cut -d' ' -f1)" \
              --rawfile signature "$name.minisig" \
              '. + [{name: $name, browser_download_url: $url, digest: $digest, signature: $signature}]' \
              <<< "$assets")
          done
          # The SSH host helpers sit beside the apps, each with its signature, which the app checks
          # before copying one to a host. The updater never reads them, so latest.json leaves them out.
          find . -mindepth 2 -type f -name "patchwork-remote-*" -exec mv {} . \;
          helpers=$(ls patchwork-remote-*)
          [ "$(echo "$helpers" | wc -l)" = 5 ] \
            || { echo "::error::Expected 5 SSH host helpers, found: $helpers"; exit 1; }
          for name in $helpers; do
            "$signer" signer sign --app-version "$version" "$name" > /dev/null
            base64 -d "$name.sig" > "$name.minisig"
            minisign -Vq -P "$key" -m "$name" -x "$name.minisig" \
              || { echo "::error::The signature of $name does not check out against the app's key"; exit 1; }
          done
          jq -n --arg tag "$TAG" --rawfile body ../notes.md --argjson assets "$assets" \
            '{tag_name: $tag, body: $body, withdrawn: [], assets: $assets}' > latest.json
          # latest.json is signed too: the app reads its version and the versions it withdraws
          # from it, and takes neither from a file the release key did not sign.
          "$signer" signer sign --app-version "$version" latest.json > /dev/null
          base64 -d latest.json.sig > latest.json.minisig
          minisign -Vq -P "$key" -m latest.json -x latest.json.minisig \
            || { echo "::error::The signature of latest.json does not check out against the app's key"; exit 1; }
          gh release create "$TAG" --draft --title "Patchwork $TAG" \
            --notes-file ../notes.md \
            Patchwork_amd64.AppImage Patchwork_x64.exe Patchwork_aarch64.dmg latest.json \
            latest.json.minisig \
            $(for name in $helpers; do echo "$name" "$name.minisig"; done)
          gh release edit "$TAG" --draft=false --latest

  # Points the website's download links at the release just published, deploys the site to
  # Cloudflare Pages, and commits the new links to main with "Changelog: none". The deploy needs
  # the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets; without them it only commits.
  site:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Point the downloads at ${{ needs.plan.outputs.tag }}
        run: node site/refresh-downloads.mjs

      # Installed before the deploy token is in any step's environment, from the lockfile in
      # .github/deploy, as the signer is.
      - name: Install the deploy tool
        working-directory: .github/deploy
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the website was not deployed."
            exit 0
          fi
          .github/deploy/node_modules/.bin/wrangler pages deploy site --project-name patchwork-site \
            --branch main --commit-dirty=true

      - name: Commit the new links to main
        run: |
          git diff --quiet -- site/index.html && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Point the website's downloads at $TAG" -m "Changelog: none" \
            -- site/index.html
          git pull -q --rebase origin main
          git push origin HEAD:main

  # Announces the release in the Discord channel named by the DISCORD_RELEASE_WEBHOOK_URL secret.
  # A trailing /github is dropped, since that suffix makes Discord expect GitHub's payload.
  announce:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Announce ${{ needs.plan.outputs.tag }} on Discord
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_RELEASE_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK_URL is not set, so the release was not announced."
            exit 0
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          jq -n --arg text "New release: Patchwork $TAG is out. $url" '{content: $text}' \
            | curl -fsS -H 'Content-Type: application/json' --data-binary @- \
              "${DISCORD_RELEASE_WEBHOOK_URL%/github}" >/dev/null
