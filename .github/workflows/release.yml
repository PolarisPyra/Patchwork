name: Release

# Pushing a tag YY.M.N releases the commit it points at. The notes job writes the release notes
# from the Changelog: lines of the PRs and commits since the previous tag: a line counting the
# changes, up to seven highlights DeepSeek picks from them, a count of the fixes left out, and every
# entry, credited to its author and PR, folded under "Full changelog". The build jobs build the Linux AppImage (scripts/build.sh),
# the Windows exe and the macOS (Apple silicon) disk image at the tag's version, and the publish
# job signs them and publishes the GitHub release beside the latest.json the app's update check
# reads. The finalize job then commits the version and the notes to main and points the website
# at the release, and the announce job posts it on Discord. docs/release.md explains it.
#
# Run it by hand (Actions → Release → Run workflow) to build all three without publishing.
#
# Actions are pinned to commits; the comment after each names the version it was.

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  # The release notes, and the Cargo.toml, Cargo.lock and CHANGELOG.md the builds use: the tag's
  # version, and its notes at the top of CHANGELOG.md, which the app shows in Settings → Updates.
  notes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    outputs:
      version: ${{ steps.changes.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Each change since the previous tag, with the group it names, its author's login and its PR.
      # A squash-merged PR's commit ends its subject in "(#N)", and its Changelog: line comes from
      # the PR body, falling back to the commit message; a commit pushed straight to main uses its
      # message. Changes with Changelog: none are left out.
      - name: Collect the changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$GITHUB_REF_NAME
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::$GITHUB_REF_NAME is not a version tag (YY.M.N)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          previous=$(git describe --tags --abbrev=0 --match '[0-9]*.*.*' --match 'v*.*.*' "$GITHUB_REF_NAME^" 2> /dev/null || true)
          paragraph() {
            awk '/^Changelog:/ { on = 1; sub(/^Changelog:[ \t]*/, "") }
              on && (/^[ \t]*$/ || /^[A-Za-z-]+-[Bb]y:/) { exit }
              on { printf "%s%s", (n++ ? " " : ""), $0 }' | sed 's/[[:space:]]*$//'
          }
          : > "$RUNNER_TEMP/entries"
          for commit in $(git rev-list --reverse "${previous:+$previous..}$GITHUB_REF_NAME"); do
            message=$(git show -s --format=%B "$commit")
            entry="" pr="" login=""
            if [[ "$(head -n 1 <<< "$message")" =~ \(#([0-9]+)\)$ ]]; then
              pr=${BASH_REMATCH[1]}
              view=$(gh pr view "$pr" --json body,author) || view={} || view={}
              login=$(jq -r '.author.login // empty' <<< "$view")
              entry=$(jq -r '.body // ""' <<< "$view" | tr -d '\r' | paragraph)
            fi
            [[ -n "$entry" ]] || entry=$(paragraph <<< "$message")
            [[ -n "$login" ]] \
              || login=$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit" --jq '.author.login // empty')
            group=Changed
            for name in Added Changed Fixed Removed Security; do
              [[ "$entry" == "$name: "* ]] && group=$name && entry=${entry#"$name: "}
            done
            [[ -z "$entry" || "${entry,,}" =~ ^none\.?$ ]] && continue
            printf '%s\t%s\t%s\t%s\n' "$group" "$entry" "${login:-$(git show -s --format=%an "$commit")}" "$pr" \
              >> "$RUNNER_TEMP/entries"
          done
          jq -R -s 'split("\n") | map(select(. != "") | split("\t")
            | {group: .[0], entry: .[1], author: .[2], pr: .[3]})' \
            "$RUNNER_TEMP/entries" > "$RUNNER_TEMP/entries.json"

      # DeepSeek picks up to seven entries worth leading with and writes each as a short name and
      # one sentence. When this step fails, or the DEEPSEEK_API_KEY secret is not set, the notes
      # are the full list alone.
      - name: Write the highlights
        continue-on-error: true
        timeout-minutes: 5
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          [ -n "$DEEPSEEK_API_KEY" ] \
            || { echo "::warning::DEEPSEEK_API_KEY is not set, so the notes have no highlights"; exit 1; }
          jq -e 'length > 0' "$RUNNER_TEMP/entries.json" > /dev/null \
            || { echo "Nothing for users since the previous release."; exit 1; }
          cat > "$RUNNER_TEMP/prompt" <<'EOF'
          Write up to 7 bullet points for the Patchwork update notes. Patchwork is a desktop app for working with coding agents. Each numbered entry below is one change since the last release, already written for users and labelled with its group.

          Give a feature a bullet only when it lets users do something they could not do before, removes a real limitation they hit in normal use, or cuts meaningful steps or wait time from a common task. Judge the outcome, regardless of the group. A new setting, a large change, or support for one more edge case is not enough.

          Lead with new capabilities. Give a bug fix its own bullet only when the entries show lost work or a core workflow that users could not complete in normal use. Leave isolated failures, cosmetic polish, and routine fixes in the count. Group entries only when they deliver the same user outcome. Seven is a ceiling. Stop when the qualifying changes run out, even if that leaves zero bullets.

          Each bullet has a short feature name and one sentence of at most 20 words. Say what the user can do or what now works. Use names people see in the app and leave out protocol or implementation details. No title, headings, introduction, example prompts, hype, or em dashes.

          Return JSON with a "highlights" array. For each highlight, give "label" (plain text, no final period), "detail" (one sentence), and "entries" (the bracketed numbers of all entries it covers). The release adds the formatting, the count of remaining fixes, and the full list. The json output has this shape: {"highlights": [{"label": "<short feature name>", "detail": "<one sentence>", "entries": [<entry number>, ...]}]}
          EOF
          request=$(jq -n --rawfile prompt "$RUNNER_TEMP/prompt" \
            --slurpfile entries "$RUNNER_TEMP/entries.json" '{
              model: "deepseek-v4-pro",
              max_tokens: 16000,
              response_format: {type: "json_object"},
              messages: [{role: "system", content: $prompt},
                {role: "user", content: ($entries[0] | to_entries
                  | map("[\(.key + 1)] \(.value.group): \(.value.entry)") | join("\n"))}]}')
          response=$(curl -sS --fail-with-body --max-time 240 https://api.deepseek.com/chat/completions \
            -H "content-type: application/json" \
            -H "authorization: Bearer $DEEPSEEK_API_KEY" \
            -d "$request") \
            || { echo "::warning::The highlights request failed: $response"; exit 1; }
          jq -e '.choices[0].finish_reason == "stop"' <<< "$response" > /dev/null \
            || { echo "::warning::The highlights were cut short: $response"; exit 1; }
          # JSON mode can answer with blank content, which counts as a failure.
          jq -r '.choices[0].message.content' <<< "$response" > "$RUNNER_TEMP/highlights.json"
          jq -e '.highlights | type == "array"' "$RUNNER_TEMP/highlights.json" > /dev/null \
            || { echo "::warning::The highlights are not in the expected form: $response"; exit 1; }

      # The notes: the count of changes and contributors, the highlights, the fixes they leave out,
      # and every entry under "Full changelog", which the app's update notes leave out. Without
      # highlights, the full list alone.
      - name: Write the release notes
        env:
          VERSION: ${{ steps.changes.outputs.version }}
        run: |
          entries=$RUNNER_TEMP/entries.json
          full=$(jq -r '. as $all | ["Added", "Changed", "Fixed", "Removed", "Security"]
            | map(. as $group | $all | map(select(.group == $group)) | select(length > 0)
              | "### \($group)\n\n" + (map("- \(.entry) by @\(.author)"
                  + (if .pr != "" then " in #\(.pr)" else "" end)) | join("\n")))
            | join("\n\n")' "$entries")
          if [ -s "$RUNNER_TEMP/highlights.json" ] \
            && summary=$(jq -r --slurpfile entries "$entries" '
              ($entries[0] | length) as $n
              | .highlights[:7] as $picked
              | [$picked[].entries[]] as $covered
              | if any($covered[]; . < 1 or . > $n) then error("an entry number is out of range") else . end
              | [range($n) | select((. + 1) as $k | any($covered[]; . == $k) | not)
                  | select($entries[0][.].group == "Fixed")] | length as $count
              | (if $count == 1 then "bug fix" else "bug fixes" end) as $kind
              | ($picked | map("- **\(.label | sub("\\.$"; "")).** \(.detail)") | join("\n")) as $bullets
              | if $count == 0 then $bullets
                elif $bullets == "" then "**\($count) \($kind).**"
                else "\($bullets)\n\n### Plus \($count) more \($kind)." end
            ' "$RUNNER_TEMP/highlights.json"); then
            header=$(jq -r --arg version "$VERSION" '
              def count($n; $word): "\($n) \($word)\(if $n == 1 then "" else "s" end)";
              "**v\($version)** · \(count(length; "change")) from \(count(map(.author) | unique | length; "contributor"))"
            ' "$entries")
            {
              echo "$header"
              if [ -n "$summary" ]; then printf '\n%s\n' "$summary"; fi
              printf '\n<details>\n<summary>Full changelog</summary>\n\n%s\n\n</details>\n' "$full"
            } > notes.md
          else
            [ ! -s "$RUNNER_TEMP/highlights.json" ] \
              || echo "::warning::The highlights could not be read, so the notes are the full list alone"
            printf '%s\n' "$full" > notes.md
          fi
          { echo "## [$VERSION] - $(date -u +%F)"; echo; cat notes.md; echo; } > section.md
          awk 'FNR == NR { section = section $0 "\n"; next }
            !done && /^## \[/ { printf "%s", section; done = 1 } { print }' \
            section.md CHANGELOG.md > "$RUNNER_TEMP/changelog"
          mv "$RUNNER_TEMP/changelog" CHANGELOG.md
          sed -i "/^\[workspace.package\]/,/^\[/s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i -E "/^name = \"patchwork(-server|-remote)?\"$/{n;s/^version = \".*\"/version = \"$VERSION\"/}" Cargo.lock
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: |
            notes.md
            section.md
            Cargo.toml
            Cargo.lock
            CHANGELOG.md
          if-no-files-found: error

  linux:
    needs: notes
    if: ${{ !cancelled() && (needs.notes.result == 'success' || github.event_name == 'workflow_dispatch') }}
    # The oldest Ubuntu runner, so the AppImage links against an older glibc and runs on newer
    # distributions too.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # appimagetool is itself an AppImage; this lets it run without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The tag's version and notes, from the notes job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'push'
        with:
          name: notes

      - name: Install the Linux packages
        timeout-minutes: 10
        run: |
          apt_options=(-o Acquire::Retries=1 -o Acquire::ForceIPv4=true \
            -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            libdbus-1-dev libfontconfig-dev \
            libfreetype-dev libwayland-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # The helpers for Linux and Windows SSH hosts.
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # zig compiles the helpers' C (SQLite, ring) for both Linux architectures and Windows.
      - name: Install zig and cargo-zigbuild
        run: |
          pip install ziglang==0.15.2
          cargo install --locked cargo-zigbuild --version 0.23.4

      - name: Build the AppImage
        run: scripts/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: |
            target/release/Patchwork_amd64.AppImage
            target/release/Patchwork.AppDir/usr/bin/patchwork-remote-*
          if-no-files-found: error

  windows:
    needs: notes
    if: ${{ !cancelled() && (needs.notes.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The tag's version and notes, from the notes job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'push'
        with:
          name: notes

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build the exe
        shell: bash
        run: |
          cargo build --release -p patchwork
          cp target/release/patchwork.exe Patchwork_x64.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: Patchwork_x64.exe
          if-no-files-found: error

  macos:
    needs: notes
    if: ${{ !cancelled() && (needs.notes.result == 'success' || github.event_name == 'workflow_dispatch') }}
    # macos-15 runs on Apple silicon, so the build is native arm64.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The tag's version and notes, from the notes job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'push'
        with:
          name: notes

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # The helpers for macOS SSH hosts on both architectures.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Patchwork.app holds the binary, its icon made from the logo, and the Info.plist naming
      # them. It is signed ad hoc, not with a developer certificate.
      - name: Build the disk image
        run: |
          cargo build --release -p patchwork
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          app=dmg/Patchwork.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" icon.iconset
          cp target/release/patchwork "$app/Contents/MacOS/"
          for arch in aarch64 x86_64; do
            cargo build --release -p patchwork-remote --target $arch-apple-darwin
            cp target/$arch-apple-darwin/release/patchwork-remote \
              "$app/Contents/MacOS/patchwork-remote-macos-$arch"
          done
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/logo.png --out icon.iconset/icon_${size}x${size}.png
            [ $size = 512 ] || sips -z $((size * 2)) $((size * 2)) assets/logo.png \
              --out icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/patchwork.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Patchwork</string>
            <key>CFBundleDisplayName</key><string>Patchwork</string>
            <key>CFBundleIdentifier</key><string>dev.patchwork.ade</string>
            <key>CFBundleExecutable</key><string>patchwork</string>
            <key>CFBundleIconFile</key><string>patchwork</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname Patchwork -srcfolder dmg -format UDZO Patchwork_aarch64.dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            Patchwork_aarch64.dmg
            dmg/Patchwork.app/Contents/MacOS/patchwork-remote-*
          if-no-files-found: error

  publish:
    needs: [notes, linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 minisign

      # The signer is installed here, before the release key is in any step's environment, from
      # the lockfile in .github/signer: npm ci takes only the packages it records, each checked
      # against the hash recorded for it, and runs none of their install scripts.
      - name: Install the signer
        working-directory: .github/signer
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Each file is signed with the release key (the TAURI_SIGNING_PRIVATE_KEY secret and its
      # password), and its signature is checked against the key built into the app, as the app's
      # updater will check it, before anything is published. latest.json then names each file's
      # address, SHA-256 and signature, which the updater reads, and is signed the same way as
      # latest.json.minisig.
      #
      # The release stays a draft until every file is up, so it never becomes the latest with
      # latest.json naming a file that is not there yet.
      - name: Sign and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$TAG
          signer="$GITHUB_WORKSPACE/.github/signer/node_modules/.bin/tauri"
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] \
            || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          key=$(sed -n 's/^const SIGNING_KEY: &str = "\(.*\)";$/\1/p' \
            crates/server/src/updates/release.rs)
          [ -n "$key" ] \
            || { echo "::error::Could not read SIGNING_KEY from crates/server/src/updates/release.rs"; exit 1; }
          cd release
          assets='[]'
          for name in Patchwork_amd64.AppImage Patchwork_x64.exe Patchwork_aarch64.dmg; do
            "$signer" signer sign --app-version "$version" "$name" > /dev/null
            base64 -d "$name.sig" > "$name.minisig"
            minisign -Vq -P "$key" -m "$name" -x "$name.minisig" \
              || { echo "::error::The signature of $name does not check out against the app's key"; exit 1; }
            assets=$(jq -c --arg name "$name" \
              --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$name" \
              --arg digest "sha256:$(sha256sum "$name" | cut -d' ' -f1)" \
              --rawfile signature "$name.minisig" \
              '. + [{name: $name, browser_download_url: $url, digest: $digest, signature: $signature}]' \
              <<< "$assets")
          done
          # The SSH host helpers sit beside the apps, each with its signature, which the app checks
          # before copying one to a host. The updater never reads them, so latest.json leaves them out.
          find . -mindepth 2 -type f -name "patchwork-remote-*" -exec mv {} . \;
          helpers=$(ls patchwork-remote-*)
          [ "$(echo "$helpers" | wc -l)" = 5 ] \
            || { echo "::error::Expected 5 SSH host helpers, found: $helpers"; exit 1; }
          for name in $helpers; do
            "$signer" signer sign --app-version "$version" "$name" > /dev/null
            base64 -d "$name.sig" > "$name.minisig"
            minisign -Vq -P "$key" -m "$name" -x "$name.minisig" \
              || { echo "::error::The signature of $name does not check out against the app's key"; exit 1; }
          done
          jq -n --arg tag "$TAG" --rawfile body ../notes.md --argjson assets "$assets" \
            '{tag_name: $tag, body: $body, withdrawn: [], assets: $assets}' > latest.json
          # latest.json is signed too: the app reads its version and the versions it withdraws
          # from it, and takes neither from a file the release key did not sign.
          "$signer" signer sign --app-version "$version" latest.json > /dev/null
          base64 -d latest.json.sig > latest.json.minisig
          minisign -Vq -P "$key" -m latest.json -x latest.json.minisig \
            || { echo "::error::The signature of latest.json does not check out against the app's key"; exit 1; }
          gh release create "$TAG" --draft --title "Patchwork $TAG" \
            --notes-file ../notes.md \
            Patchwork_amd64.AppImage Patchwork_x64.exe Patchwork_aarch64.dmg latest.json \
            latest.json.minisig \
            $(for name in $helpers; do echo "$name" "$name.minisig"; done)
          gh release edit "$TAG" --draft=false --latest

  # Commits the release's version and notes to main, as "Release YY.M.N" with "Changelog: none",
  # points the website's download links at it and deploys the site to Cloudflare Pages. The deploy
  # needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets; without them it only commits.
  finalize:
    needs: [notes, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.notes.outputs.version }}
    permissions:
      contents: write
    steps:
      # The ruleset on main lets only this deploy key push without a PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes

      - name: Set the version and notes on main
        run: |
          awk 'FNR == NR { section = section $0 "\n"; next }
            !done && /^## \[/ { printf "%s", section; done = 1 } { print }' \
            "$RUNNER_TEMP/notes/section.md" CHANGELOG.md > "$RUNNER_TEMP/changelog"
          mv "$RUNNER_TEMP/changelog" CHANGELOG.md
          sed -i "/^\[workspace.package\]/,/^\[/s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i -E "/^name = \"patchwork(-server|-remote)?\"$/{n;s/^version = \".*\"/version = \"$VERSION\"/}" Cargo.lock

      - name: Point the downloads at ${{ github.ref_name }}
        run: node site/refresh-downloads.mjs

      # Installed before the deploy token is in any step's environment, from the lockfile in
      # .github/deploy, as the signer is.
      - name: Install the deploy tool
        working-directory: .github/deploy
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the website was not deployed."
            exit 0
          fi
          .github/deploy/node_modules/.bin/wrangler pages deploy site --project-name patchwork-site \
            --branch main --commit-dirty=true

      # main can move while this job runs, so a rejected push rebases and tries again.
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Release $TAG" -m "Changelog: none" \
            -- CHANGELOG.md Cargo.toml Cargo.lock site/index.html
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            echo "The push was turned down (attempt $attempt), so it rebases onto main."
            git pull -q --rebase origin main
          done
          echo "::error::Could not push the release commit to main"
          exit 1

  # Announces the release in the Discord channel named by the DISCORD_RELEASE_WEBHOOK_URL secret.
  # A trailing /github is dropped, since that suffix makes Discord expect GitHub's payload.
  announce:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Announce ${{ github.ref_name }} on Discord
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_RELEASE_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK_URL is not set, so the release was not announced."
            exit 0
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          jq -n --arg text "New release: Patchwork $TAG is out. $url" '{content: $text}' \
            | curl -fsS -H 'Content-Type: application/json' --data-binary @- \
              "${DISCORD_RELEASE_WEBHOOK_URL%/github}" >/dev/null
