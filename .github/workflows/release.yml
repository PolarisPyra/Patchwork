name: Release

# A pushed tag vX.Y.Z builds the Linux AppImage (scripts/build.sh), the Windows exe and the macOS
# (Apple silicon) disk image, and publishes them as the GitHub release with CHANGELOG.md's section
# for X.Y.Z as its notes, beside the latest.json the app's update check reads, then points the
# website at it and announces it on Discord. docs/release.md explains how to cut one.
#
# Run it by hand (Actions → Release → Run workflow) to build all three without publishing.
#
# Actions are pinned to commits; the comment after each names the version it was.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  # Fails before anything builds when the tag does not match the app's version or the changelog
  # has no notes for it.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the version and notes
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          app=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ "$version" = "$app" ] || { echo "::error::$GITHUB_REF_NAME, but Cargo.toml says $app"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }

  linux:
    needs: check
    # The oldest Ubuntu runner, so the AppImage links against an older glibc and runs on newer
    # distributions too.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # appimagetool is itself an AppImage; this lets it run without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 libdbus-1-dev libfontconfig-dev \
            libfreetype-dev libwayland-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build the AppImage
        run: scripts/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: target/release/Patchwork_amd64.AppImage
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build the exe
        shell: bash
        run: |
          cargo build --release -p patchwork
          cp target/release/patchwork.exe Patchwork_x64.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: Patchwork_x64.exe
          if-no-files-found: error

  macos:
    needs: check
    # macos-15 runs on Apple silicon, so the build is native arm64.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Patchwork.app holds the binary, its icon made from the logo, and the Info.plist naming
      # them. It is signed ad hoc, not with a developer certificate.
      - name: Build the disk image
        run: |
          cargo build --release -p patchwork
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          app=dmg/Patchwork.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" icon.iconset
          cp target/release/patchwork "$app/Contents/MacOS/"
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/logo.png --out icon.iconset/icon_${size}x${size}.png
            [ $size = 512 ] || sips -z $((size * 2)) $((size * 2)) assets/logo.png \
              --out icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/patchwork.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Patchwork</string>
            <key>CFBundleDisplayName</key><string>Patchwork</string>
            <key>CFBundleIdentifier</key><string>dev.patchwork.ade</string>
            <key>CFBundleExecutable</key><string>patchwork</string>
            <key>CFBundleIconFile</key><string>patchwork</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname Patchwork -srcfolder dmg -format UDZO Patchwork_aarch64.dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: Patchwork_aarch64.dmg
          if-no-files-found: error

  publish:
    needs: [linux, windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 minisign

      # Each file is signed with the release key (the TAURI_SIGNING_PRIVATE_KEY secret and its
      # password), and its signature is checked against the key built into the app, as the app's
      # updater will check it, before anything is published. latest.json then names each file's
      # address, SHA-256 and signature, which the updater reads, and is signed the same way as
      # latest.json.minisig.
      #
      # The release stays a draft until every file is up, so it never becomes the latest with
      # latest.json naming a file that is not there yet.
      - name: Sign and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] \
            || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          key=$(sed -n 's/^const SIGNING_KEY: &str = "\(.*\)";$/\1/p' \
            crates/server/src/updates/release.rs)
          [ -n "$key" ] \
            || { echo "::error::Could not read SIGNING_KEY from crates/server/src/updates/release.rs"; exit 1; }
          awk -v head="## [$version]" \
            'index($0, head) == 1 { on = 1; print; next } on && /^## \[/ { exit } on' \
            CHANGELOG.md > notes.md
          cd release
          assets='[]'
          for name in Patchwork_amd64.AppImage Patchwork_x64.exe Patchwork_aarch64.dmg; do
            npx --yes @tauri-apps/cli@2.12.3 signer sign --app-version "$version" "$name" > /dev/null
            base64 -d "$name.sig" > "$name.minisig"
            minisign -Vq -P "$key" -m "$name" -x "$name.minisig" \
              || { echo "::error::The signature of $name does not check out against the app's key"; exit 1; }
            assets=$(jq -c --arg name "$name" \
              --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name" \
              --arg digest "sha256:$(sha256sum "$name" | cut -d' ' -f1)" \
              --rawfile signature "$name.minisig" \
              '. + [{name: $name, browser_download_url: $url, digest: $digest, signature: $signature}]' \
              <<< "$assets")
          done
          jq -n --arg tag "$GITHUB_REF_NAME" --rawfile body ../notes.md --argjson assets "$assets" \
            '{tag_name: $tag, body: $body, withdrawn: [], assets: $assets}' > latest.json
          # latest.json is signed too: the app reads its version and the versions it withdraws
          # from it, and takes neither from a file the release key did not sign.
          npx --yes @tauri-apps/cli@2.12.3 signer sign --app-version "$version" latest.json > /dev/null
          base64 -d latest.json.sig > latest.json.minisig
          minisign -Vq -P "$key" -m latest.json -x latest.json.minisig \
            || { echo "::error::The signature of latest.json does not check out against the app's key"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --draft --title "Patchwork $GITHUB_REF_NAME" \
            --notes-file ../notes.md \
            Patchwork_amd64.AppImage Patchwork_x64.exe Patchwork_aarch64.dmg latest.json \
            latest.json.minisig
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  # Points the website's download links at the release just published, deploys the site to
  # Cloudflare Pages, and commits the new links to main with "Changelog: none". The deploy needs
  # the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets; without them it only commits.
  site:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Point the downloads at ${{ github.ref_name }}
        run: node site/refresh-downloads.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the website was not deployed."
            exit 0
          fi
          npx --yes wrangler@4.156.2 pages deploy site --project-name patchwork-site \
            --branch main --commit-dirty=true

      - name: Commit the new links to main
        run: |
          git diff --quiet -- site/index.html && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Point the website's downloads at $GITHUB_REF_NAME" -m "Changelog: none" \
            -- site/index.html
          git pull -q --rebase origin main
          git push origin HEAD:main

  # Announces the release in the Discord channel named by the DISCORD_RELEASE_WEBHOOK_URL secret.
  # A trailing /github is dropped, since that suffix makes Discord expect GitHub's payload.
  announce:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Announce ${{ github.ref_name }} on Discord
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_RELEASE_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK_URL is not set, so the release was not announced."
            exit 0
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          jq -n --arg text "New release: Patchwork $GITHUB_REF_NAME is out. $url" '{content: $text}' \
            | curl -fsS -H 'Content-Type: application/json' --data-binary @- \
              "${DISCORD_RELEASE_WEBHOOK_URL%/github}" >/dev/null
