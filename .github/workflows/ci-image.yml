name: CI Image

# Builds and publishes the Ubuntu 22.04 container image used by Linux CI and Release builds so they
# skip apt, rustup, zig, cargo-zigbuild, cargo-audit, mold and appimagetool installation.
#
# Actions are pinned to commits; the comment after each names the version it was.

on:
  push:
    branches: [main]
    paths: [".github/ci-image/**", ".github/workflows/ci-image.yml"]
  pull_request:
    paths: [".github/ci-image/**", ".github/workflows/ci-image.yml"]
  workflow_dispatch:
  schedule:
    - cron: "13 5 * * 0"

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github/ci-image
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/polarispyra/patchwork-ci:latest
            ghcr.io/polarispyra/patchwork-ci:rust-1.99.0
          labels: |
            org.opencontainers.image.source=https://github.com/PolarisPyra/Patchwork
          cache-from: type=gha
          cache-to: type=gha,mode=max
