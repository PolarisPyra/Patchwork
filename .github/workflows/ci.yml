name: CI

# Checks every push to main and every pull request with what `scripts/release.sh` checks before a
# release: the web app's types and formatting, rustfmt, clippy, the Rust tests, and that the
# generated wire types are committed. It runs on the Ubuntu the AppImage is built on, so a Linux
# build problem shows here rather than at release.
#
# Actions are pinned to commits; the comment after each names the version it was.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run's result moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same compiler the Release workflow builds with.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          rust-components: rustfmt, clippy

      # Saved only from main, so every branch and pull request starts from main's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The desktop crate embeds the web app's build, so it is built first.
      - name: Build the web app
        run: pnpm --filter patchwork-web build

      - name: Check
        run: pnpm check

      - name: Wire types are committed
        run: git diff --exit-code -- apps/web/src/bindings

      - name: Test
        run: cargo test --workspace
