name: CI

# Checks every push to main and a run started by hand with what `scripts/release.sh` checks before a
# release: the web app's types and formatting, rustfmt, clippy, the Rust tests, and that the
# generated wire types are committed. It runs on the Ubuntu the AppImage is built on, so a Linux
# build problem shows here rather than at release. When a push to main passes, the Release workflow
# starts: it updates the release pull request, or tags and publishes a release whose pull request
# was just merged.
#
# Pull requests are not checked: the only ones are the release pull request's, one commit of the
# version and notes on top of a commit these checks passed on, and GitHub holds a run for it until
# someone approves it.
#
# Actions are pinned to commits; the comment after each names the version it was.

on:
  push:
    branches: [main]
    # Nothing these check, such as the links the Release workflow commits to the website after a
    # release.
    paths-ignore: ["site/**", "docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run's result moot: on main, the newer run's release
# pull request carries the older push's commits too.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same compiler the Release workflow builds with.
  RUST_TOOLCHAIN: "1.99.0"
  # No debug info in the check and test builds, which nothing here debugs: it was most of the Rust
  # cache, which took longer to restore than the checks took to run.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          rust-components: rustfmt, clippy
          cache-packages: "true"

      # Saved only from main, so a run by hand on another branch starts from main's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The desktop crate embeds the web app's build, so it is built first.
      - name: Build the web app
        run: pnpm --filter patchwork-web build

      - name: Check
        run: pnpm check

      - name: Wire types are committed
        run: git diff --exit-code -- apps/web/src/bindings

      - name: Test
        run: cargo test --workspace
