name: CI

# Checks every push to main and a run started by hand: rustfmt, clippy, and the Rust tests.
#
# Actions are pinned to commits; the comment after each names the version it was.

on:
  push:
    branches: [main]
    # Nothing these check.
    paths-ignore: ["site/**", "docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run's result moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.99.0"
  # No debug info in the check and test builds, which nothing here debugs: it was most of the Rust
  # cache, which took longer to restore than the checks took to run.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The runner's Azure apt mirror is sometimes throttled, so use archive.ubuntu.com directly.
      - name: Use archive.ubuntu.com
        run: sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt

      # What GPUI links against on Linux: X11 and Wayland input, fonts, and D-Bus.
      - name: Install the Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 libdbus-1-dev libfontconfig-dev \
            libfreetype-dev libwayland-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      # Saved only from main, so a run by hand on another branch starts from main's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
