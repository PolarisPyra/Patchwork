name: Deploy API

# Deploys the account service (crates/api) to api.patchworkeditor.com after each push to main that
# passes the CI workflow, when crates/api or Cargo.lock changed since the commit the server runs. It
# builds the static musl binary, copies it over SSH as the `deploy` user, restarts the service, and
# puts the previous binary back if the health check then fails. The service applies new migrations
# as it starts, so a rollback after one can't start the old binary; the run fails either way.
# docs/accounts.md explains the server side.
#
# Run it by hand (Actions → Deploy API → Run workflow) on main to deploy whatever changed.
#
# It needs the production environment's API_DEPLOY_HOST, API_DEPLOY_SSH_KEY and
# API_DEPLOY_KNOWN_HOSTS secrets; without them it only warns.
#
# Actions are pinned to commits; the comment after each names the version it was.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A newer run waits rather than cancelling one halfway through, and it deploys
# the newer commit, which carries the older one's changes too.
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  # The same compiler CI checks with.
  RUST_TOOLCHAIN: "1.99.0"
  TARGET: x86_64-unknown-linux-musl

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Connect to the server
        id: ssh
        env:
          API_DEPLOY_HOST: ${{ secrets.API_DEPLOY_HOST }}
          API_DEPLOY_SSH_KEY: ${{ secrets.API_DEPLOY_SSH_KEY }}
          API_DEPLOY_KNOWN_HOSTS: ${{ secrets.API_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$API_DEPLOY_HOST" ] || [ -z "$API_DEPLOY_SSH_KEY" ] || [ -z "$API_DEPLOY_KNOWN_HOSTS" ]; then
            echo "::warning::The API_DEPLOY_* secrets are not set, so the API was not deployed."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$API_DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$API_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
          printf 'Host api\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  BatchMode yes\n' \
            "$API_DEPLOY_HOST" > ~/.ssh/config
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # The server's REVISION file holds the commit it runs. A run by hand, a missing or unknown
      # REVISION, or a change under crates/api or in Cargo.lock since it, deploys.
      - name: Check what changed
        id: plan
        if: steps.ssh.outputs.ready == 'true'
        run: |
          running=$(ssh api 'cat /opt/patchwork-api/REVISION 2>/dev/null' || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$running" ] \
            || ! git cat-file -e "$running^{commit}" 2>/dev/null \
            || ! git diff --quiet "$running" "$SHA" -- crates/api Cargo.lock; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "The server already runs the API as of ${SHA:0:7} (it runs ${running:0:7})."
          fi

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: steps.plan.outputs.deploy == 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.plan.outputs.deploy == 'true'
        with:
          shared-key: api-musl

      # The runner's gcc builds ring's C for musl; no musl-gcc is needed.
      - name: Build
        if: steps.plan.outputs.deploy == 'true'
        env:
          CC_x86_64_unknown_linux_musl: gcc
        run: cargo build --release --locked -p patchwork-api --target "$TARGET"

      # The new binary goes in beside the running one and replaces it in one rename; the running
      # one stays as patchwork-api.prev until the next deploy.
      - name: Deploy ${{ env.SHA }}
        if: steps.plan.outputs.deploy == 'true'
        run: |
          scp -q "target/$TARGET/release/patchwork-api" api:/opt/patchwork-api/patchwork-api.new
          ssh api bash -s -- "$SHA" <<'EOF'
          set -eu
          cd /opt/patchwork-api
          healthy() {
            for _ in $(seq 20); do
              curl -fsS 127.0.0.1:8080/v1/health >/dev/null 2>&1 && return 0
              sleep 0.5
            done
            return 1
          }
          chmod 755 patchwork-api.new
          if [ -e patchwork-api ]; then ln -f patchwork-api patchwork-api.prev; fi
          mv -f patchwork-api.new patchwork-api
          if sudo systemctl restart patchwork-api && healthy; then
            echo "$1" > REVISION
            echo "Deployed ${1:0:7}."
            exit 0
          fi
          echo "::error::The new API didn't start or answer its health check; putting the previous one back."
          if [ -e patchwork-api.prev ]; then
            ln -f patchwork-api.prev patchwork-api
            sudo systemctl restart patchwork-api && healthy \
              || echo "::error::The previous API didn't come back either; see journalctl -u patchwork-api."
          fi
          exit 1
          EOF
