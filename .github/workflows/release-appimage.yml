name: Release

# Builds the Linux AppImage, the Windows installer, and the macOS (Apple silicon) disk image when a
# version tag (v0.1.0, v0.2.0, ...) is pushed, then creates a GitHub release for that tag with all
# three attached. Patchwork updates itself from these files, checking each against GitHub's
# SHA-256 digest. While the TAURI_SIGNING_PRIVATE_KEY secret is set, the release also carries the
# signed update files and latest.json that Patchwork 0.6.7 and older update from.
# Pushes to main don't build. Run it by hand from the Actions tab to build without a
# tag; the release job only runs for tags.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # Build on the oldest Ubuntu runner still available so the AppImage links
    # against an older glibc and runs on newer distributions too.
    runs-on: ubuntu-22.04
    env:
      # linuxdeploy is itself an AppImage; this lets it run without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        # Prebuilt Ubuntu packages, kept in the Actions cache: the WebKitGTK ones are large, and a
        # slow Ubuntu mirror once held a release at this step for over 15 minutes. Change `version`
        # to refresh the cached packages.
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            build-essential file libayatana-appindicator3-dev libfuse2 librsvg2-dev libssl-dev
            libwebkit2gtk-4.1-dev libxdo-dev patchelf
          version: 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        # scripts/release.sh already wrote the tag's version into the repo; this makes a tag pushed
        # without the script build with its own version too.
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      - name: Build AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/build.sh appimage

      - name: Find AppImage
        id: find
        run: |
          path=$(ls target/release/bundle/appimage/*.AppImage | head -n 1)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: patchwork-appimage
          path: |
            ${{ steps.find.outputs.path }}
            ${{ steps.find.outputs.path }}.sig

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        # scripts/release.sh already wrote the tag's version into the repo; this makes a tag pushed
        # without the script build with its own version too.
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=()
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            args=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          pnpm --filter patchwork-desktop exec tauri build --bundles nsis "${args[@]}"

      - name: Find installer
        id: find
        run: |
          path=$(ls target/release/bundle/nsis/*-setup.exe | head -n 1)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: patchwork-windows
          path: |
            ${{ steps.find.outputs.path }}
            ${{ steps.find.outputs.path }}.sig

  macos:
    # macos-14 runs on Apple silicon, so the build is native arm64.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        # scripts/release.sh already wrote the tag's version into the repo; this makes a tag pushed
        # without the script build with its own version too.
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      - name: Build disk image
        # The app bundle is what the updater downloads, as Patchwork.app.tar.gz. A signed build
        # packs it itself; otherwise it is packed here.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=()
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            args=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          pnpm --filter patchwork-desktop exec tauri build --bundles app,dmg "${args[@]}"
          bundle=target/release/bundle/macos
          [[ -f "$bundle/Patchwork.app.tar.gz" ]] || tar -czf "$bundle/Patchwork.app.tar.gz" -C "$bundle" Patchwork.app

      - name: Find disk image
        id: find
        run: |
          path=$(ls target/release/bundle/dmg/*.dmg | head -n 1)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: patchwork-macos-arm64
          path: |
            ${{ steps.find.outputs.path }}
            target/release/bundle/macos/Patchwork.app.tar.gz
            target/release/bundle/macos/Patchwork.app.tar.gz.sig

  release:
    needs: [appimage, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff needs the full history and tags to build the release notes.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Gather the release files
        # An artifact with files from several folders keeps those folders, as the macOS one does;
        # the release takes every file from dist itself.
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          ls -l dist

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --output RELEASE_NOTES.md

      - name: Write the update manifest
        # Patchwork 0.6.7 and older read latest.json from the latest release: each platform's
        # download and the signature of that file. Without the signing key there is none.
        run: |
          if ! ls dist/*.sig > /dev/null 2>&1; then
            echo "No signed files; the release has no latest.json."
            exit 0
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          platform() {
            [[ -f "$1" && -f "$1.sig" ]] || { echo "Missing $1 or its signature." >&2; exit 1; }
            jq -n --arg url "$base/$(basename "$1")" --arg signature "$(cat "$1.sig")" \
              '{url: $url, signature: $signature}'
          }
          linux=$(platform dist/Patchwork_amd64.AppImage)
          windows=$(platform "$(ls dist/*-setup.exe | head -n 1)")
          macos=$(platform dist/Patchwork.app.tar.gz)
          jq -n --arg version "${GITHUB_REF_NAME#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile notes RELEASE_NOTES.md \
            --argjson linux "$linux" --argjson windows "$windows" --argjson macos "$macos" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "linux-x86_64-appimage": $linux,
              "windows-x86_64-nsis": $windows,
              "darwin-aarch64-app": $macos
            }}' > dist/latest.json
          cat dist/latest.json

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Patchwork $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
