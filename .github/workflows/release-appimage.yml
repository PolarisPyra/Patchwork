name: Release

# Builds the Linux AppImage, the Windows installer, and the macOS (Apple silicon) disk image and app
# bundle when a version tag (v0.1.0, v0.2.0, ...) is pushed, publishes them to
# updates.patchworkeditor.com, and creates a GitHub release with the notes. scripts/release.sh does
# the work. docs/release.md explains it, including how it keeps to a private repo's limits.
#
# A push to main that changes the Rust dependencies builds Linux and Windows without publishing,
# only to save their dependency caches: a tag's run can restore caches saved on main, but not ones
# saved by another tag.
#
# Actions are pinned to commits, so a moved tag can't change what runs next to the secrets. The
# comment after each names the version it was.

on:
  push:
    tags:
      - "v*"
    # GitHub ignores `paths` for tag pushes, so it only narrows the pushes to main.
    branches:
      - main
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - .github/workflows/release-appimage.yml
  workflow_dispatch:

permissions:
  contents: read

# A second run for the same ref would build and upload the same files again.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, because the dependency caches are only reused by the same compiler. Changing it here
  # rebuilds them on the next push to main.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  appimage:
    # Build on the oldest Ubuntu runner still available so the AppImage links
    # against an older glibc and runs on newer distributions too.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # Release commits change Cargo.lock only by Patchwork's own version, which the cache ignores.
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'Release v')
    outputs:
      assets: ${{ steps.upload.outputs.assets }}
    env:
      # linuxdeploy is itself an AppImage; this lets it run without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The runner's Azure apt mirror is sometimes throttled (55 MB once took 20 minutes), so
      # drop it from the mirror list and use archive.ubuntu.com directly.
      - name: Install Tauri Linux dependencies
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 build-essential file libayatana-appindicator3-dev libfuse2 \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: scripts/release.sh ci-build linux

      - name: Upload
        id: upload
        if: github.ref_type == 'tag'
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: scripts/release.sh ci-upload linux

  windows:
    # A Dev Drive is needed for the Windows 2025 image's native ReFS support.
    runs-on: windows-2025
    timeout-minutes: 45
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'Release v')
    outputs:
      assets: ${{ steps.upload.outputs.assets }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Cargo writes tens of thousands of files, and Defender scans each on C:. A trusted Dev
      # Drive skips that, so the checkout, the Rust toolchain, and cargo's files all live on one.
      - uses: samypr100/setup-dev-drive@cf663fdf88945e3faaa980ec525b5bc2350fbf9d # v3
        with:
          drive-size: 25GB
          workspace-copy: true
          trusted-dev-drive: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-windows
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE }} -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: scripts/release.sh ci-build windows

      - name: Upload
        id: upload
        if: github.ref_type == 'tag'
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: scripts/release.sh ci-upload windows

  macos:
    # macos-14 runs on Apple silicon, so the build is native arm64. Its minutes count ten times
    # against the private repo's allowance, so its timeout is the tightest, and it builds only for
    # a release: its build is quick without a cache.
    runs-on: macos-14
    timeout-minutes: 30
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    outputs:
      assets: ${{ steps.upload.outputs.assets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: scripts/release.sh ci-build macos

      - name: Upload
        id: upload
        if: github.ref_type == 'tag'
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: scripts/release.sh ci-upload macos

  # The only job with the signing key or write access. It runs none of the project's dependencies:
  # it fetches each published file back, checks it, signs it with the Tauri CLI the lockfile pins,
  # checks the signature against the key built into the app, and only then publishes latest.json.
  release:
    needs: [appimage, windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 minisign

      - name: Check, sign, and publish latest.json and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          LINUX: ${{ needs.appimage.outputs.assets }}
          WINDOWS: ${{ needs.windows.outputs.assets }}
          MACOS: ${{ needs.macos.outputs.assets }}
        run: scripts/release.sh ci-release
