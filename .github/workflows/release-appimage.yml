name: Release

# Builds the Linux AppImage, the Windows installer, and the macOS (Apple silicon) disk image and app
# bundle when a version tag (v0.1.0, v0.2.0, ...) is pushed, publishes them to
# updates.patchworkeditor.com, and creates a GitHub release with the notes. scripts/release.sh does
# the work. docs/release.md explains it, including how it keeps to a private repo's limits.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# A second run for the same ref would build and upload the same files again.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    # Build on the oldest Ubuntu runner still available so the AppImage links
    # against an older glibc and runs on newer distributions too.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      assets: ${{ steps.build.outputs.assets }}
    env:
      # linuxdeploy is itself an AppImage; this lets it run without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libayatana-appindicator3-dev libfuse2 \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        id: build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: scripts/release.sh ci-build linux

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      assets: ${{ steps.build.outputs.assets }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        id: build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: scripts/release.sh ci-build windows

  macos:
    # macos-14 runs on Apple silicon, so the build is native arm64. Its minutes count ten times
    # against the private repo's allowance, so its timeout is the tightest.
    runs-on: macos-14
    timeout-minutes: 30
    outputs:
      assets: ${{ steps.build.outputs.assets }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        id: build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: scripts/release.sh ci-build macos

  release:
    needs: [appimage, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff needs the full history and tags to build the release notes.
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --output RELEASE_NOTES.md

      - name: Publish latest.json and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          LINUX: ${{ needs.appimage.outputs.assets }}
          WINDOWS: ${{ needs.windows.outputs.assets }}
          MACOS: ${{ needs.macos.outputs.assets }}
        run: scripts/release.sh ci-release
