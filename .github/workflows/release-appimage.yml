name: Release

# Builds the Linux AppImage, the Windows installer, and the macOS (Apple silicon) disk image when a
# version tag (v0.1.0, v0.2.0, ...) is pushed. Each build job uploads its files straight to
# updates.patchworkeditor.com (a Bunny storage zone), so nothing goes through GitHub's artifact
# storage, which a private repo has little of. The release job then publishes latest.json there,
# which Patchwork 0.10.10 and newer update from, checking each file's SHA-256 digest and signature,
# and creates a GitHub release with the notes.
# Pushes to main don't build. Run it by hand from the Actions tab to check the build without a
# tag; only tags publish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # Build on the oldest Ubuntu runner still available so the AppImage links
    # against an older glibc and runs on newer distributions too.
    runs-on: ubuntu-22.04
    outputs:
      assets: ${{ steps.publish.outputs.assets }}
    env:
      # linuxdeploy is itself an AppImage; this lets it run without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        # Prebuilt Ubuntu packages, kept in the Actions cache: the WebKitGTK ones are large, and a
        # slow Ubuntu mirror once held a release at this step for over 15 minutes. Change `version`
        # to refresh the cached packages.
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            build-essential file libayatana-appindicator3-dev libfuse2 librsvg2-dev libssl-dev
            libwebkit2gtk-4.1-dev libxdo-dev patchelf
          version: 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        # scripts/release.sh already wrote the tag's version into the repo; this makes a tag pushed
        # without the script build with its own version too.
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      - name: Build AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/build.sh appimage

      - name: Find AppImage
        id: find
        run: |
          path=$(ls target/release/bundle/appimage/*.AppImage | head -n 1)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Publish to updates.patchworkeditor.com
        id: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          FILE: ${{ steps.find.outputs.path }}
        run: echo "assets=$(scripts/publish-files.sh "$GITHUB_REF_NAME" "$FILE")" >> "$GITHUB_OUTPUT"

  windows:
    runs-on: windows-latest
    outputs:
      assets: ${{ steps.publish.outputs.assets }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        # scripts/release.sh already wrote the tag's version into the repo; this makes a tag pushed
        # without the script build with its own version too.
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=()
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            args=(--config "$GITHUB_WORKSPACE/apps/desktop/src-tauri/tauri.signing.conf.json")
          fi
          pnpm --filter patchwork-desktop exec tauri build --bundles nsis "${args[@]}"

      - name: Find installer
        id: find
        run: |
          path=$(ls target/release/bundle/nsis/*-setup.exe | head -n 1)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Publish to updates.patchworkeditor.com
        id: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          FILE: ${{ steps.find.outputs.path }}
        run: echo "assets=$(scripts/publish-files.sh "$GITHUB_REF_NAME" "$FILE")" >> "$GITHUB_OUTPUT"

  macos:
    # macos-14 runs on Apple silicon, so the build is native arm64.
    runs-on: macos-14
    outputs:
      assets: ${{ steps.publish.outputs.assets }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        # scripts/release.sh already wrote the tag's version into the repo; this makes a tag pushed
        # without the script build with its own version too.
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      - name: Build disk image
        # The app bundle is what the updater downloads, as Patchwork.app.tar.gz. A signed build
        # packs it itself; otherwise it is packed here.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=()
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            args=(--config "$GITHUB_WORKSPACE/apps/desktop/src-tauri/tauri.signing.conf.json")
          fi
          pnpm --filter patchwork-desktop exec tauri build --bundles app,dmg "${args[@]}"
          bundle=target/release/bundle/macos
          [[ -f "$bundle/Patchwork.app.tar.gz" ]] || tar -czf "$bundle/Patchwork.app.tar.gz" -C "$bundle" Patchwork.app

      - name: Find disk image
        id: find
        run: |
          path=$(ls target/release/bundle/dmg/*.dmg | head -n 1)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Publish to updates.patchworkeditor.com
        # The disk image is for new installs; the updater downloads Patchwork.app.tar.gz.
        id: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          FILE: ${{ steps.find.outputs.path }}
        run: |
          assets=$(scripts/publish-files.sh "$GITHUB_REF_NAME" "$FILE" target/release/bundle/macos/Patchwork.app.tar.gz)
          echo "assets=$assets" >> "$GITHUB_OUTPUT"

  release:
    needs: [appimage, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff needs the full history and tags to build the release notes.
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --output RELEASE_NOTES.md

      - name: Publish latest.json to updates.patchworkeditor.com
        # In the shape of GitHub's release API, plus each file's signature, as the updater reads it.
        # It goes up after the build jobs uploaded every file, so it never names a missing one,
        # and its cached copy is purged.
        env:
          STORAGE: https://ny.storage.bunnycdn.com/patchwork-releases
          PUBLIC: https://updates.patchworkeditor.com
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          LINUX: ${{ needs.appimage.outputs.assets }}
          WINDOWS: ${{ needs.windows.outputs.assets }}
          MACOS: ${{ needs.macos.outputs.assets }}
        run: |
          jq -n --arg tag "$GITHUB_REF_NAME" --arg public "$PUBLIC" \
            --argjson linux "$LINUX" --argjson windows "$WINDOWS" --argjson macos "$MACOS" \
            '{tag_name: $tag, assets: ($linux + $windows + $macos | map({
              name,
              browser_download_url: "\($public)/\($tag)/\(.name)",
              digest,
              signature: (.sig | if . then @base64d else null end)
            }))}' > latest.json
          cat latest.json
          curl -fsS --retry 3 -T latest.json -H "AccessKey: $BUNNY_STORAGE_PASSWORD" \
            -H "Content-Type: application/json" "$STORAGE/latest.json" > /dev/null
          curl -fsS -X POST -H "AccessKey: $BUNNY_API_KEY" \
            "https://api.bunny.net/purge?url=$PUBLIC/latest.json"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Patchwork $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
