# git-cliff configuration for CHANGELOG.md.
# Run `git cliff --tag vX.Y.Z -o CHANGELOG.md` before tagging a release (see docs/releasing.md).

[changelog]
header = """
# Changelog

All notable changes to Patchwork are documented here.
This file is generated by git-cliff from the commit history.

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first | split(pat="\n") | first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
# Rewords pushed commit subjects that describe a change too narrowly.
commit_preprocessors = [
    { pattern = "^Stop labelling pasted terminal output as JavaScript", replace = "Fix pasted text getting the wrong syntax highlighting language" },
    { pattern = "^Make the sidebar tree as compact and readable as VS Code's explorer", replace = "Make the sidebar tree more compact and readable" },
    { pattern = "^Add a terminal and Output panel, and keep debug logs the way VS Code does", replace = "Add a terminal and Output panel, and keep debug logs in a log folder per session" },
    { pattern = "^Match the Projects tree to VS Code's explorer selection and reordering", replace = "Improve selecting and reordering in the Projects tree" },
]
commit_parsers = [
    { message = "^(Fix|Fixed|Repair|Stop|Prevent|Correct)", group = "Fixed" },
    { message = "^(Add|Show|Support|Allow|Introduce|Let|Remember|Reopen|Animate|Draw|Track|List|Render|Enable|Create)", group = "Added" },
    { message = "^(Remove|Drop|Delete|Deprecate)", group = "Removed" },
    { message = "^(Update|Change|Polish|Tighten|Refactor|Rename|Move|Align|Make|Improve|Describe|Sidebar|Choice|Use|Replace)", group = "Changed" },
    { message = "^(Release|Bump|Merge|Chore)", skip = true },
    { message = "^Reword the v[0-9.]+ changelog", skip = true },
    { message = ".*", group = "Other" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
