[package]
name = "patchwork-remote"
description = "Patchwork's helper on SSH hosts: runs agents, their hooks and their relays there"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
patchwork-harness.workspace = true
patchwork-platform.workspace = true
base64 = { workspace = true, default-features = true }
libc = { workspace = true, default-features = true }
serde = { workspace = true, default-features = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }

[target.'cfg(windows)'.dependencies]
# Seeing the connection that started the helper close, on a Windows host.
windows-sys = { workspace = true, default-features = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO"] }

[lints]
workspace = true
