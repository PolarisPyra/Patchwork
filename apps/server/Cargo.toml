[package]
name = "patchwork-server"
# The app's version is in apps/desktop/src-tauri/tauri.conf.json; releases leave this alone.
version = "0.0.0"
description = "Patchwork backend: providers, persistence, usage, and thread import"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
serde_json = "1.0"

[dependencies]
base64 = "0.22"
serde_json = "1.0"
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
uuid = { version = "1", features = ["v4"] }
which = "7"
libc = "0.2"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-json-impl"] }
rusqlite = { version = "0.37", features = ["bundled"] }
ureq = { version = "3", features = ["json"] }
# API providers: keys in the system credential store, and the agent's file search tools.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
ignore = "0.4"
# Watching the open project for changes.
notify = "8"
globset = "0.4"
regex = "1"
# Debug log folder names and line times in local time.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Exporting the debug logs as one file to send with a bug report.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Computer use: a screenshot of the primary monitor, and the pointer and keyboard under it.
enigo = { version = "0.6" }
image = { version = "0.25", default-features = false, features = ["png"] }

# Screenshots. On Linux they are taken in src/screen.rs with crates the app already builds, since
# xcap would also build PipeWire, which needs newer headers than the AppImage's build machine has.
[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = { version = "0.9", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
zbus = "5"
url = "2"
# Activation tokens from the Wayland compositor, so the windows a program opens come forward.
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "stream"
harness = false
