[package]
name = "patchwork-server"
version = "0.8.6"
description = "Patchwork backend: providers, persistence, usage, and thread import"
edition = "2024"
rust-version = "1.90"

[dependencies]
base64 = "0.22"
serde_json = "1.0"
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
uuid = { version = "1", features = ["v4"] }
which = "7"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
ureq = { version = "3", features = ["json"] }
# API providers: keys in the system credential store, and the agent's file search tools.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
ignore = "0.4"
# Watching the open project for changes.
notify = "8"
globset = "0.4"
regex = "1"
