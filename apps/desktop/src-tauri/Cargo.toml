[package]
name = "patchwork"
version = "0.6.11"
description = "Patchwork — an agentic development environment"
edition = "2024"
rust-version = "1.90"

[lib]
name = "patchwork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.12.4", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
# The plugin config in tauri.conf.json is read through serde_json.
serde_json = "1"
patchwork-server = { path = "../../server" }
notify = "8"
tauri-plugin-opener = "2"
# Update checks and downloads from the GitHub releases.
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
semver = "1"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9"
glib = "0.18"
