[package]
name = "patchwork"
# The app's version is in apps/desktop/src-tauri/tauri.conf.json; releases leave this alone.
version = "0.0.0"
license = "AGPL-3.0-or-later"
description = "Patchwork — an agentic development environment"
edition = "2024"
rust-version = "1.90"

[lib]
name = "patchwork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.12.4", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["sync", "time"] }
serde = { version = "1", features = ["derive"] }
# The plugin config in tauri.conf.json is read through serde_json.
serde_json = "1"
patchwork-server = { path = "../../../crates/server" }
tauri-plugin-opener = "2"
# Update checks and downloads, and the signature check on each download.
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
semver = "1"
minisign-verify = "0.3"
# Pasted images and copied files, which the webview does not give the page on every system.
arboard = { version = "3.7", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9"
glib = "0.18"
# The display GTK draws on, for the Wayland activation token (see src/activation.rs).
gdk = "0.18"
