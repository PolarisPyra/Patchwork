[package]
name = "patchwork-dylib"
description = "The app's dependencies in one shared library, so a debug rebuild relinks only Patchwork"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["dylib"]

# Each is linked into this library, and from it into every crate that uses it. None turns on a
# feature: the crates that use them do. rusqlite is left out: a Rust library doesn't export the C
# functions of the SQLite it bundles, which the app's own code calls.
[dependencies]
anyhow.workspace = true
argon2.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
dirs.workspace = true
enigo.workspace = true
futures.workspace = true
globset.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
ignore.workspace = true
image.workspace = true
log.workspace = true
minisign-verify.workspace = true
notify.workspace = true
portable-pty.workspace = true
pulldown-cmark.workspace = true
qrcodegen.workspace = true
regex.workspace = true
resvg.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tungstenite.workspace = true
unicode-segmentation.workspace = true
ureq.workspace = true
url.workspace = true
uuid.workspace = true
vt100.workspace = true
zeroize.workspace = true
zip.workspace = true
zune-jpeg.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
zbus.workspace = true

[lints]
workspace = true
