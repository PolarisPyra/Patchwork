[package]
name = "patchwork-ui-markdown"
description = "Patchwork's rich text rendering: Markdown layout, syntax highlighting, sigils, formatting and selectable text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
patchwork-ui-components.workspace = true
patchwork-ui-theme.workspace = true

chrono = { workspace = true, features = ["clock"] }
gpui = { workspace = true, default-features = true }
log = { workspace = true, default-features = true }
pulldown-cmark.workspace = true
serde_json = { workspace = true, default-features = true }
syntect.workspace = true
# Syntax definitions for syntect beyond its own set, such as TypeScript and TOML.
two-face = { workspace = true, features = ["syntect-onig"] }
unicode-segmentation = { workspace = true, default-features = true }

[lints]
workspace = true
