[package]
name = "patchwork"
description = "Patchwork's native window, drawn with GPUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
patchwork-design-components.workspace = true
patchwork-design-editor.workspace = true
patchwork-design-icons.workspace = true
patchwork-design-tasks.workspace = true
patchwork-design-text.workspace = true
patchwork-design-theme.workspace = true
patchwork-views-actions.workspace = true
patchwork-views-chat.workspace = true
patchwork-views-logos.workspace = true
patchwork-core.workspace = true
patchwork-server.workspace = true
patchwork-gateway.workspace = true
patchwork-lifecycle.workspace = true
patchwork-desktop-emulator.workspace = true
patchwork-desktop-browser.workspace = true
patchwork-desktop-dialogs.workspace = true
patchwork-desktop-agents.workspace = true
patchwork-desktop-canvas.workspace = true
patchwork-desktop-orchestrator.workspace = true
patchwork-desktop-source-control.workspace = true
patchwork-desktop-usage.workspace = true
patchwork-desktop-dock.workspace = true
patchwork-desktop-sidebar.workspace = true
patchwork-desktop-chat.workspace = true
patchwork-desktop-onboarding.workspace = true
patchwork-desktop-quilts.workspace = true
patchwork-desktop-search.workspace = true
patchwork-desktop-settings.workspace = true
patchwork-platform.workspace = true
patchwork-client = { workspace = true, features = ["local"] }
patchwork-themes.workspace = true

chrono = { workspace = true, features = ["clock"] }
dirs.workspace = true
futures = { workspace = true, default-features = true }
gpui = { workspace = true, default-features = true }
gpui-hot-reload = { workspace = true, optional = true }
image = { workspace = true, features = ["png", "jpeg", "webp"] }
log = { workspace = true, default-features = true }
# The global allocator: it is faster than the system one on the allocation-heavy paths of
# layout and text shaping.
mimalloc = { workspace = true, default-features = true }
serde = { workspace = true, default-features = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
vt100 = { workspace = true, default-features = true }

[features]
# Patches changed code into the running app in place: GPUI connects to `dx serve --hot-patch`
# (`cargo run desktop`) and every view renders through a patchable function.
hot-reload = ["gpui-hot-reload/hot-reload"]

[build-dependencies]
# Embeds the Windows icon in the exe.
embed-resource.workspace = true

[lints]
workspace = true
