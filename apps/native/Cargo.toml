[package]
name = "patchwork-native"
# The app's version is in apps/desktop/src-tauri/tauri.conf.json; releases leave this alone.
version = "0.0.0"
license = "MIT"
description = "Patchwork's native window, drawn with GPUI"
edition = "2024"
rust-version = "1.90"

[dependencies]
base64 = "0.22"
gpui = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b", features = ["font-kit", "wayland", "x11"] }
log = "0.4"
patchwork-server = { path = "../../crates/server" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
pulldown-cmark = { version = "0.13", default-features = false }
rust-embed = { version = "8", features = ["include-exclude"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
unicode-segmentation = "1"
vt100 = "0.16"
