# `cargo oxidation`: rebuilds the app on each save and restarts it. See crates/patchwork_oxidation.

[build]
package = "patchwork"
# Cranelift compiles Patchwork's own crates, which nightly has (`rustup component add
# rustc-codegen-cranelift-preview --toolchain nightly`); the dependencies stay on LLVM.
toolchain = "nightly"
args = [
    # The dependencies come from one shared library, so a rebuild relinks only Patchwork.
    "--features", "dynamic",
    "-Zcodegen-backend",
    "--config", 'profile.dev.codegen-backend="cranelift"',
    "--config", 'profile.dev.package."*".codegen-backend="llvm"',
]
# A folder of its own, so an editor's cargo check never holds the build's lock.
target_dir = "target/oxidation"

# Optional Linux fast linker (`cargo install --locked wild-linker`), auto-enabled when present on PATH.
[build.targets.linux]
linker = "wild"
linker_driver = "clang"

[run]
# The app saves its window and Settings page before a restart, hands its terminals to the next
# run, shows build errors, and reads theme and SVG files on request.
handoff = true

[watch]
paths = ["apps", "crates", "Cargo.toml", "assets"]
ignore = ["crates/patchwork_oxidation/**", "crates/patchwork_oxidation_client/**"]
# Theme files and SVG drawings are read again by the running app.
send = [
    "assets/themes/**",
    "assets/scenes/**",
    "assets/code-themes/**",
    "assets/icons/*.svg",
    "assets/logos/*.svg",
    "assets/*.svg",
]
# Fonts are read from disk at launch, so a restart shows them without a build.
restart = ["assets/**"]
